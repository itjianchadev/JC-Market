<!doctype html>
<html lang="th"><head>
<meta charset="utf-8">
<title>คนขับ — JC-Market</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#AD9C82">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#AD9C82; --gold-dark:#8a7d66; --beige:#f5efe5;
  --card:#fff; --border:#e6dfd2; --text:#2a2118; --muted:#7a6f5f;
  --ok:#16a34a; --err:#dc2626; --warn:#d97706;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;font-family:'Sarabun',sans-serif;background:var(--beige);color:var(--text);min-height:100vh}
body{padding-bottom:env(safe-area-inset-bottom)}

/* Topbar */
.top{background:var(--gold);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.top .brand{font-weight:700;font-size:18px;flex:1}
.top .who{font-size:12px;opacity:.9}
.top .btn-logout{background:rgba(255,255,255,.15);border:none;color:#fff;padding:6px 10px;border-radius:8px;font-family:inherit;font-size:12px;cursor:pointer}

/* Layout */
.wrap{max-width:560px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 6px rgba(0,0,0,.03)}
.card h2{margin:0 0 6px;font-size:16px;color:var(--gold-dark)}
.card .sub{color:var(--muted);font-size:12px;margin-bottom:8px}

/* Login */
.login-card{max-width:340px;margin:60px auto 0}
.login-card h1{font-size:20px;margin:0 0 6px;color:var(--gold-dark);text-align:center}
.login-card p.tag{text-align:center;color:var(--muted);font-size:13px;margin:0 0 22px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.field input{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;font-size:15px;font-family:inherit;background:#fafafa}
.field input:focus{outline:none;border-color:var(--gold);background:#fff}
.btn{background:var(--gold);color:#fff;border:none;padding:12px 16px;border-radius:10px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;width:100%}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--gold-dark);border:1px solid var(--gold)}
.btn.danger{background:var(--err)}
.err{color:var(--err);font-size:13px;margin-top:8px;min-height:18px}

/* Driver profile card */
.profile-card{background:linear-gradient(135deg,#fff 0%,#fdfaf3 100%);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:14px;box-shadow:0 2px 6px rgba(0,0,0,.03)}
.profile-card .profile-row{display:flex;align-items:center;gap:12px}
.profile-card .avatar{width:48px;height:48px;border-radius:50%;background:var(--gold);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;flex-shrink:0;box-shadow:0 2px 4px rgba(0,0,0,.1)}
.profile-card .name{font-size:15px;font-weight:600;color:var(--text)}
.profile-card .sub{font-size:12px;color:var(--muted);margin-top:2px}
.profile-card .meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--border)}
.profile-card .meta .k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin-bottom:2px}
.profile-card .meta .v{font-size:14px;font-weight:600;color:var(--text)}
.profile-card .plate-pill{display:inline-block;background:var(--beige);color:var(--gold-dark);padding:4px 10px;border-radius:6px;font-weight:700;font-family:'Sarabun',sans-serif;letter-spacing:.5px}

/* Trip card */
.trip-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px}
.trip-no{background:var(--beige);color:var(--gold-dark);padding:4px 10px;border-radius:99px;font-size:12px;font-weight:600}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:11px;font-weight:600}
.pill-planned{background:#fef3c7;color:#92400e}
.pill-dispatched{background:#dbeafe;color:#1d4ed8}
.pill-delivered{background:#d1fae5;color:#065f46}
.pill-pending{background:#f3f4f6;color:#6b7280}
.pill-failed{background:#fee2e2;color:#991b1b}
.trip-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px}
.trip-meta .k{color:var(--muted);font-size:11px}
.trip-meta .v{color:var(--text);font-weight:500}

/* Stops */
.stop{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;position:relative}
.stop .seq{position:absolute;left:-10px;top:14px;background:var(--gold);color:#fff;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;box-shadow:0 2px 4px rgba(0,0,0,.1)}
.stop .body{padding-left:22px}
.stop .branch{font-size:15px;font-weight:600;color:var(--text)}
.stop .branch-name{color:var(--muted);font-size:12px;margin-top:2px}
.stop .row{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12px;color:var(--muted)}
.stop .row .order-no{font-family:monospace}
.stop .addr{color:var(--muted);font-size:12px;margin-top:6px;line-height:1.4}
.stop .phone{color:var(--gold-dark);font-size:12px;margin-top:4px}

.empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:14px}
.spinner{text-align:center;padding:30px;color:var(--muted)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:1000;box-shadow:0 4px 12px rgba(0,0,0,.2)}

/* POD modal */
.pod-modal{position:fixed;inset:0;background:rgba(42,33,24,.6);z-index:1000;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:16px}
.pod-modal .box{background:var(--card);border-radius:14px;padding:16px;max-width:500px;width:100%;position:relative;margin-top:20px}
.pod-modal h3{margin:0 0 12px;color:var(--gold-dark);font-size:16px;display:flex;align-items:center;gap:8px}
.pod-modal .close{position:absolute;top:10px;right:14px;background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer}
.pod-section{margin-bottom:14px}
.pod-section label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600}
.pod-camera-btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:14px;background:#fafafa;border:2px dashed var(--border);border-radius:10px;cursor:pointer;color:var(--gold-dark);font-weight:600}
.pod-camera-btn input{display:none}
#podPhotoPreview img{display:block;margin-top:8px}
#sigCanvas{width:100%;height:140px;background:#fafafa;border:1px solid var(--border);border-radius:8px;touch-action:none;display:block}
.pod-input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;background:#fafafa}
.pod-input:focus{outline:none;border-color:var(--gold);background:#fff}
.pod-geo{font-size:11px;color:var(--muted);text-align:center;padding:6px;background:var(--beige);border-radius:6px}
</style>
</head>
<body>

<!-- Login view -->
<div id="loginView">
  <div class="wrap">
    <div class="card login-card">
      <h1>🚚 JC-Market · คนขับ</h1>
      <p class="tag">กรอกเบอร์มือถือที่ลงทะเบียนไว้</p>
      <form id="loginForm" onsubmit="return doLogin(event)">
        <div class="field">
          <label>เบอร์มือถือ</label>
          <input name="phone" type="tel" inputmode="numeric" autocomplete="tel" pattern="[0-9 +\-()]+" placeholder="0812345678" required autofocus>
        </div>
        <button type="submit" class="btn">เข้าสู่ระบบ</button>
        <p id="loginErr" class="err"></p>
      </form>
    </div>
  </div>
</div>

<!-- Main view (after login) -->
<div id="mainView" style="display:none">
  <div class="top">
    <div>
      <div class="brand">JC-Market 🚚</div>
      <div class="who" id="whoText"></div>
    </div>
    <div style="flex:1"></div>
    <button class="btn-logout" onclick="doLogout()">ออกจากระบบ</button>
  </div>
  <div class="wrap">
    <div id="driverCard"></div>
    <div id="content" class="spinner">กำลังโหลด…</div>
  </div>
</div>

<!-- POD upload modal -->
<div class="pod-modal" id="podModal">
  <div class="box">
    <button class="close" onclick="closePod()">×</button>
    <h3>📦 ส่งสินค้า · <span id="podStop"></span></h3>
    <form id="podForm" onsubmit="return submitPod(event)">
      <div class="pod-section">
        <label>ถ่ายรูปสินค้า / ป้ายสาขา</label>
        <label class="pod-camera-btn">
          <span>📷 เปิดกล้อง / เลือกรูป</span>
          <input type="file" name="photo" accept="image/*" capture="environment" onchange="onPhotoChange(this)" required>
        </label>
        <div id="podPhotoPreview"></div>
      </div>
      <div class="pod-section">
        <label>ลายเซ็นผู้รับ</label>
        <canvas id="sigCanvas"></canvas>
        <button type="button" class="btn ghost" style="margin-top:6px;padding:6px 12px;font-size:12px;width:auto" onclick="clearSignature()">↺ ล้างลายเซ็น</button>
      </div>
      <div class="pod-section">
        <label>ชื่อผู้รับ (ไม่บังคับ)</label>
        <input class="pod-input" name="signed_by_name" placeholder="ชื่อ-นามสกุล">
      </div>
      <div class="pod-section">
        <label>หมายเหตุ (ไม่บังคับ)</label>
        <input class="pod-input" name="notes" placeholder="เช่น เซ็นแทนเจ้าของ">
      </div>
      <div class="pod-geo" id="podGeo">📍 กำลังหาตำแหน่ง...</div>
      <p id="podErr" class="err"></p>
      <div style="display:flex;gap:8px;margin-top:12px">
        <button type="button" class="btn ghost" onclick="closePod()" style="flex:1">ยกเลิก</button>
        <button type="submit" class="btn" style="flex:2">บันทึก POD</button>
      </div>
    </form>
  </div>
</div>

<script>
const TOKEN_KEY = 'jcsm_driver_token';
const DRIVER_KEY = 'jcsm_driver';

function getToken(){ return localStorage.getItem(TOKEN_KEY); }
function getDriver(){ try { return JSON.parse(localStorage.getItem(DRIVER_KEY)); } catch { return null; } }
function setAuth(token, driver) {
  localStorage.setItem(TOKEN_KEY, token);
  localStorage.setItem(DRIVER_KEY, JSON.stringify(driver));
}
function clearAuth() {
  localStorage.removeItem(TOKEN_KEY);
  localStorage.removeItem(DRIVER_KEY);
}

async function api(path, opts = {}) {
  const r = await fetch(path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', ...(getToken() ? { Authorization: 'Bearer ' + getToken() } : {}), ...(opts.headers || {}) },
  });
  if (r.status === 401) {
    clearAuth();
    showLogin();
    throw new Error('Session หมดอายุ');
  }
  if (!r.ok) {
    const t = await r.text().catch(() => '');
    let msg = t;
    try { msg = JSON.parse(t).error || msg; } catch {}
    throw new Error(msg || ('HTTP ' + r.status));
  }
  return r.json();
}

function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2500);
}

async function doLogin(e) {
  e.preventDefault();
  const f = e.target;
  const errEl = document.getElementById('loginErr');
  errEl.textContent = '';
  try {
    const r = await fetch('/api/tms/driver/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone: f.phone.value }),
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'Login failed');
    setAuth(j.token, j.driver);
    showMain();
  } catch (err) {
    errEl.textContent = err.message;
  }
  return false;
}

function doLogout() {
  if (!confirm('ออกจากระบบ?')) return;
  clearAuth();
  showLogin();
}

function showLogin() {
  document.getElementById('loginView').style.display = 'block';
  document.getElementById('mainView').style.display = 'none';
  document.getElementById('driverCard').innerHTML = '';
  document.getElementById('content').innerHTML = '';
}

async function showMain() {
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('mainView').style.display = 'block';
  // Refresh driver row from /me so a vehicle/phone change by admin shows up
  // on the driver's next interaction without a re-login.
  try {
    const fresh = await api('/api/tms/driver/me');
    if (fresh) localStorage.setItem(DRIVER_KEY, JSON.stringify(fresh));
  } catch {}
  const d = getDriver();
  document.getElementById('whoText').textContent = d ? `${d.full_name} · ${d.carrier_code}` : '';
  renderProfileCard(d);
  await loadToday();
}

function renderProfileCard(d) {
  const el = document.getElementById('driverCard');
  if (!d) { el.innerHTML = ''; return; }
  // First-letter initial in a circle stands in for an avatar — drivers don't
  // upload photos in this phase. Pick from full_name so it's a real letter
  // they'd recognize ("ค" for "คนขับ ..." etc.).
  const initial = (d.full_name || d.username || '?').trim().charAt(0);
  el.innerHTML = `
    <div class="profile-card">
      <div class="profile-row">
        <div class="avatar">${initial}</div>
        <div style="flex:1">
          <div class="name">${d.full_name}</div>
          <div class="sub">${d.carrier_code}${d.carrier_name ? ' · ' + d.carrier_name : ''}</div>
        </div>
      </div>
      <div class="meta">
        <div>
          <div class="k">ทะเบียนรถ</div>
          <div class="v"><span class="plate-pill">${d.vehicle_plate || '—'}</span></div>
        </div>
        <div>
          <div class="k">จังหวัด</div>
          <div class="v">${d.vehicle_province || '—'}</div>
        </div>
        <div>
          <div class="k">เบอร์ติดต่อ</div>
          <div class="v"><a href="tel:${d.phone || ''}" style="color:inherit;text-decoration:none">${d.phone || '—'}</a></div>
        </div>
        <div>
          <div class="k">Username</div>
          <div class="v" style="font-family:monospace;font-size:13px">${d.username}</div>
        </div>
      </div>
    </div>
  `;
}

const STATUS_PILL = {
  pending:    { cls:'pill-pending',    label:'รอจัดส่ง' },
  planned:    { cls:'pill-planned',    label:'รอออกรถ' },
  intransit:  { cls:'pill-dispatched', label:'อยู่ระหว่างขนส่ง' },
  delivered:  { cls:'pill-delivered',  label:'ส่งแล้ว' },
  failed:     { cls:'pill-failed',     label:'ส่งไม่สำเร็จ' },
};

async function loadToday() {
  const root = document.getElementById('content');
  root.innerHTML = '<div class="spinner">กำลังโหลด…</div>';
  try {
    const trip = await api('/api/tms/driver/today');
    renderTrip(trip);
  } catch (err) {
    root.innerHTML = `<div class="card"><div class="err">${err.message}</div></div>`;
  }
}

// Module-scope state shared between renderTrip and the action handlers.
let currentTrip = null;
let gpsWatchId = null;

function renderTrip(trip) {
  currentTrip = trip;
  const root = document.getElementById('content');
  if (!trip) {
    stopGpsLoop();
    root.innerHTML = `
      <div class="card">
        <h2>📭 ไม่มี Trip สำหรับวันนี้</h2>
        <div class="sub">วันนี้ยังไม่ได้ถูกจัดงานวิ่ง · กรุณารอ admin วาง trip ให้</div>
      </div>`;
    return;
  }
  const todayStr = new Date().toISOString().slice(0,10);
  const isPlanned = trip.status === 'planned';
  const isDispatched = trip.status === 'dispatched';
  const statusKey = isDispatched ? 'intransit' : (trip.status === 'completed' ? 'delivered' : 'planned');
  const statusPill = STATUS_PILL[statusKey] || STATUS_PILL.pending;

  // Start / stop the GPS ping loop based on the trip's current state.
  if (isDispatched) startGpsLoop(trip.id);
  else stopGpsLoop();

  root.innerHTML = `
    <div class="card">
      <div class="trip-head">
        <div style="flex:1">
          <h2>วันนี้ ${todayStr === trip.scheduled_date ? '' : '· ' + trip.scheduled_date}</h2>
          <div class="sub">${trip.carrier_code} · ${trip.carrier_name || ''}</div>
        </div>
        <div class="trip-no">${trip.trip_number}</div>
      </div>
      <div class="trip-meta">
        <div><div class="k">ทะเบียนรถ</div><div class="v">${trip.vehicle_plate || '-'}</div></div>
        <div><div class="k">จุดส่ง</div><div class="v">${(trip.stops || []).length} จุด</div></div>
        <div><div class="k">สถานะ</div><div class="v"><span class="pill ${statusPill.cls}">${statusPill.label}</span></div></div>
        <div><div class="k">ค่าเที่ยว</div><div class="v">฿${(trip.cost_agreed || 0).toLocaleString()}</div></div>
      </div>
      ${trip.note ? `<div style="margin-top:10px;padding:8px 10px;background:var(--beige);border-radius:8px;font-size:12px;color:var(--muted)">📝 ${trip.note}</div>` : ''}
      ${isPlanned ? `<button class="btn" style="margin-top:14px" onclick="doDispatch()">🚚 ออกรถจาก CTI</button>` : ''}
      ${isDispatched ? `<div style="margin-top:12px;padding:10px;background:#dbeafe;color:#1d4ed8;border-radius:8px;font-size:12px;text-align:center">🛰️ กำลังติดตามตำแหน่ง (GPS)</div>` : ''}
    </div>

    <h3 style="font-size:14px;color:var(--gold-dark);margin:18px 0 10px">📍 รายการจุดส่ง (${(trip.stops || []).length})</h3>

    ${(trip.stops || []).map(s => {
      const sp = STATUS_PILL[s.status] || STATUS_PILL.pending;
      const canDeliver = isDispatched && s.status === 'intransit';
      const pod = s.pod || null;
      return `
      <div class="stop">
        <div class="seq">${s.stop_seq || '?'}</div>
        <div class="body">
          <div class="branch">${s.dest_branch_code}</div>
          <div class="branch-name">${s.branch_name || ''}</div>
          ${s.branch_address ? `<div class="addr">📌 ${s.branch_address}</div>` : ''}
          ${s.branch_phone ? `<div class="phone">📞 <a href="tel:${s.branch_phone}" style="color:inherit;text-decoration:none">${s.branch_phone}</a></div>` : ''}
          <div class="row">
            <span class="order-no">${s.order_number || s.shipment_number}</span>
            <span class="pill ${sp.cls}">${sp.label}</span>
          </div>
          ${pod ? `
          <div style="margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);display:flex;gap:10px;align-items:center">
            ${pod.photo_url ? `<a href="${pod.photo_url}" target="_blank"><img src="${pod.photo_url}" style="width:64px;height:64px;object-fit:cover;border-radius:8px"></a>` : ''}
            ${pod.signature_url ? `<img src="${pod.signature_url}" style="width:90px;height:48px;object-fit:contain;background:#fafafa;border-radius:6px"></a>` : ''}
            <div style="flex:1;font-size:11px;color:var(--muted)">
              ${pod.signed_by_name ? `<div>โดย: ${pod.signed_by_name}</div>` : ''}
              <div>${pod.received_at}</div>
            </div>
          </div>` : ''}
          ${canDeliver ? `<button class="btn" style="margin-top:10px" onclick="openPod(${s.id},'${s.dest_branch_code}',${s.stop_seq})">📦 ส่งแล้ว — อัปโหลด POD</button>` : ''}
        </div>
      </div>`;
    }).join('') || '<div class="empty">ไม่มีจุดส่งใน trip นี้</div>'}
  `;
}

// ─── Dispatch ────────────────────────────────────────────────────────────
async function doDispatch() {
  if (!currentTrip) return;
  if (!confirm('ยืนยันออกรถจาก CTI?\nหลังจากนี้จะเริ่มติดตาม GPS')) return;
  try {
    await api(`/api/tms/driver/trips/${currentTrip.id}/dispatch`, { method:'POST' });
    toast('ออกรถแล้ว · GPS เริ่มทำงาน');
    await loadToday();
  } catch (e) { alert(e.message); }
}

// ─── GPS ping loop ────────────────────────────────────────────────────────
// watchPosition gives us position updates; we throttle to one upload per
// PING_INTERVAL so we don't hammer the server. Geolocation requires a
// secure context (https or localhost) — if the browser refuses, we silently
// stop trying so the rest of the UI keeps working.
const PING_INTERVAL = 30 * 1000;
let lastPingAt = 0;

function startGpsLoop(tripId) {
  if (gpsWatchId !== null) return;
  if (!navigator.geolocation) return;
  gpsWatchId = navigator.geolocation.watchPosition(async (pos) => {
    const now = Date.now();
    if (now - lastPingAt < PING_INTERVAL) return;
    lastPingAt = now;
    try {
      await api(`/api/tms/driver/trips/${tripId}/ping`, {
        method: 'POST',
        body: JSON.stringify({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
      });
    } catch {}
  }, (err) => {
    console.warn('[gps]', err.message);
  }, { enableHighAccuracy: true, maximumAge: 15000, timeout: 20000 });
}
function stopGpsLoop() {
  if (gpsWatchId !== null && navigator.geolocation) {
    navigator.geolocation.clearWatch(gpsWatchId);
    gpsWatchId = null;
  }
}

// ─── POD modal (camera + signature canvas) ────────────────────────────────
let podState = null; // { shipmentId, sigCtx, drawing, lastLatLng }
function openPod(shipmentId, branchCode, seq) {
  podState = { shipmentId, lastLatLng: null };
  document.getElementById('podStop').textContent = `จุดที่ ${seq} · ${branchCode}`;
  document.getElementById('podForm').reset();
  document.getElementById('podPhotoPreview').innerHTML = '';
  document.getElementById('podErr').textContent = '';
  // Try to capture position once when opening — gives instant geotag
  // even if the GPS loop hasn't fired yet for this shipment.
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition((p) => {
      podState.lastLatLng = { lat: p.coords.latitude, lng: p.coords.longitude };
      document.getElementById('podGeo').textContent = `📍 ${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)}`;
    }, () => {
      document.getElementById('podGeo').textContent = '📍 (ไม่ได้รับตำแหน่ง)';
    });
  }
  setupSignatureCanvas();
  document.getElementById('podModal').style.display = 'flex';
}
function closePod() {
  document.getElementById('podModal').style.display = 'none';
  podState = null;
}

function setupSignatureCanvas() {
  const canvas = document.getElementById('sigCanvas');
  // Resize to device pixel ratio so the stroke isn't blurry on retina.
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = '#2a2118';
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  let drawing = false;
  const getPos = (e) => {
    const r = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - r.left, y: t.clientY - r.top };
  };
  const start = (e) => { e.preventDefault(); drawing = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); };
  const move  = (e) => { if (!drawing) return; e.preventDefault(); const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); };
  const end   = ()  => { drawing = false; };
  canvas.ontouchstart = start; canvas.ontouchmove = move; canvas.ontouchend = end;
  canvas.onmousedown = start;  canvas.onmousemove = move;  canvas.onmouseup = end; canvas.onmouseleave = end;
}
function clearSignature() {
  const canvas = document.getElementById('sigCanvas');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

function onPhotoChange(input) {
  const file = input.files && input.files[0];
  const preview = document.getElementById('podPhotoPreview');
  preview.innerHTML = '';
  if (!file) return;
  const url = URL.createObjectURL(file);
  preview.innerHTML = `<img src="${url}" style="max-width:100%;max-height:160px;border-radius:8px;border:1px solid var(--border)">`;
}

async function submitPod(e) {
  e.preventDefault();
  if (!podState) return false;
  const form = e.target;
  const file = form.photo.files[0];
  if (!file) { document.getElementById('podErr').textContent = 'กรุณาถ่ายรูปสินค้า'; return false; }
  // Pull the signature image data — but only if the canvas actually has
  // strokes. Empty canvas → transparent PNG → server still writes a file.
  // We can't easily detect "untouched" so just send whatever the canvas
  // looks like; the planner will see no signature if user didn't sign.
  const canvas = document.getElementById('sigCanvas');
  const sigData = canvas.toDataURL('image/png');
  const fd = new FormData();
  fd.append('photo', file);
  fd.append('signature', sigData);
  fd.append('signed_by_name', form.signed_by_name.value || '');
  fd.append('notes', form.notes.value || '');
  if (podState.lastLatLng) {
    fd.append('lat', podState.lastLatLng.lat);
    fd.append('lng', podState.lastLatLng.lng);
  }
  try {
    const r = await fetch(`/api/tms/driver/shipments/${podState.shipmentId}/pod`, {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + getToken() },
      body: fd,
    });
    if (!r.ok) {
      const j = await r.json().catch(() => ({}));
      throw new Error(j.error || ('HTTP ' + r.status));
    }
    toast('บันทึก POD เรียบร้อย');
    closePod();
    await loadToday();
  } catch (err) {
    document.getElementById('podErr').textContent = err.message;
  }
  return false;
}

// Boot — if we already have a token, jump to main; otherwise show login.
if (getToken()) {
  showMain().catch(() => showLogin());
} else {
  showLogin();
}
</script>
</body></html>
