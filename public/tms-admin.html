<!doctype html>
<html lang="th"><head>
<meta charset="utf-8"><title>ขนส่ง (TMS) — JC-Market</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
.dtable{width:100%;border-collapse:collapse;font-size:13px}
.dtable thead th{background:var(--beige);color:var(--gold-dark);padding:10px;text-align:left;font-size:12px;font-weight:600;border-bottom:1px solid var(--gold)}
.dtable tbody td{padding:10px;border-bottom:1px solid var(--border);vertical-align:middle}
.dtable tbody tr:nth-child(even){background:var(--beige)}
.dtable tbody tr.row-selected{background:#fff9e6;outline:2px solid var(--gold);outline-offset:-2px}
.dtable tbody tr.row-clickable{cursor:pointer}
.dtable tbody tr.row-clickable:hover{background:rgba(173,156,130,.15)}

.pill-on{display:inline-block;padding:2px 10px;border-radius:99px;font-size:11px;font-weight:600;background:#d1fae5;color:#065f46}
.pill-off{display:inline-block;padding:2px 10px;border-radius:99px;font-size:11px;font-weight:600;background:#f3f4f6;color:#6b7280}
.count-badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;background:var(--beige);color:var(--gold-dark);font-weight:600}

.modal{position:fixed;inset:0;background:rgba(42,33,24,.5);backdrop-filter:blur(4px);z-index:1000;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:30px 16px}
.modal .box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;max-width:520px;width:100%;position:relative}
.modal .box h3{margin-bottom:16px}
.modal .close{position:absolute;top:12px;right:16px;background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer}
.form-row{margin-bottom:10px}
.form-row label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.form-grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.section-card{margin-bottom:24px}
.empty{text-align:center;color:var(--muted);padding:24px;font-size:13px}
.hint{font-size:12px;color:var(--muted);margin:0 0 12px 4px}

@media(max-width:640px){.form-grid2{grid-template-columns:1fr}}
</style>
</head><body data-i18n-title="tms.page_title">
<div id="nav"></div>
<div class="container">

  <!-- Carriers panel -->
  <div class="section-card">
    <div class="toolbar">
      <h3 style="margin:0;color:var(--gold-dark)" data-i18n="tms.carriers">ผู้ให้บริการขนส่ง (Carriers)</h3>
      <span class="count-badge" id="carrierCount">0</span>
      <div class="spacer" style="flex:1"></div>
      <button class="btn sm" id="btnAddCarrier" onclick="openCarrierModal()" data-i18n="tms.add_carrier">+ เพิ่ม Carrier</button>
    </div>
    <p class="hint" data-i18n="tms.click_carrier_hint">คลิกแถวเพื่อดูคนขับใต้ Carrier นั้น</p>
    <div class="card" style="padding:0;overflow-x:auto">
      <table class="dtable">
        <thead><tr>
          <th data-i18n="tms.col.code">รหัส</th>
          <th data-i18n="tms.col.name">ชื่อ</th>
          <th data-i18n="tms.col.phone">โทร</th>
          <th data-i18n="tms.col.email">อีเมล</th>
          <th data-i18n="tms.col.cost_default">เหมาเที่ยว</th>
          <th data-i18n="tms.col.drivers">คนขับ</th>
          <th data-i18n="tms.col.status">สถานะ</th>
          <th data-i18n="tms.col.actions">จัดการ</th>
        </tr></thead>
        <tbody id="carrierBody"></tbody>
      </table>
    </div>
  </div>

  <!-- Drivers panel -->
  <div class="section-card">
    <div class="toolbar">
      <h3 style="margin:0;color:var(--gold-dark)"><span data-i18n="tms.drivers">คนขับ (Drivers)</span><span id="driversFor" style="color:var(--muted);font-weight:400;font-size:14px;margin-left:6px"></span></h3>
      <div class="spacer" style="flex:1"></div>
      <button class="btn sm" id="btnAddDriver" onclick="openDriverModal()" disabled data-i18n="tms.add_driver">+ เพิ่มคนขับ</button>
    </div>
    <div class="card" style="padding:0;overflow-x:auto">
      <table class="dtable">
        <thead><tr>
          <th data-i18n="tms.col.username">Username</th>
          <th data-i18n="tms.col.full_name">ชื่อ</th>
          <th data-i18n="tms.col.phone">โทร</th>
          <th data-i18n="tms.col.plate">ทะเบียนรถ</th>
          <th data-i18n="tms.col.status">สถานะ</th>
          <th data-i18n="tms.col.actions">จัดการ</th>
        </tr></thead>
        <tbody id="driverBody"><tr><td colspan="6" class="empty" data-i18n="tms.select_carrier_first">เลือก Carrier ด้านบนก่อน</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Carrier modal (add/edit) -->
<div class="modal" id="carrierModal">
  <div class="box">
    <button class="close" onclick="closeCarrier()">×</button>
    <h3 id="carrierModalTitle" data-i18n="tms.add_carrier">เพิ่ม Carrier</h3>
    <form id="carrierForm" onsubmit="return saveCarrier(event)">
      <div class="form-grid2">
        <div class="form-row"><label data-i18n="tms.col.code">รหัส</label><input name="code" required placeholder="KERRY"></div>
        <div class="form-row"><label data-i18n="tms.col.name">ชื่อ</label><input name="name" required></div>
      </div>
      <div class="form-grid2">
        <div class="form-row"><label data-i18n="tms.col.phone">โทร</label><input name="contact_phone"></div>
        <div class="form-row"><label data-i18n="tms.col.email">อีเมล</label><input name="contact_email" type="email"></div>
      </div>
      <div class="form-row"><label data-i18n="tms.col.cost_default">เหมาเที่ยว (default)</label><input name="default_cost_per_trip" type="number" step="0.01" min="0"></div>
      <div class="form-row"><label data-i18n="tms.col.note">หมายเหตุ</label><textarea name="note" rows="2"></textarea></div>
      <p id="carrierErr" style="color:var(--err);font-size:12px;min-height:18px;margin:8px 0"></p>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button type="button" class="btn ghost" onclick="closeCarrier()" data-i18n="common.cancel">ยกเลิก</button>
        <button type="submit" class="btn" data-i18n="common.save">บันทึก</button>
      </div>
    </form>
  </div>
</div>

<!-- Driver modal (add/edit) -->
<div class="modal" id="driverModal">
  <div class="box">
    <button class="close" onclick="closeDriver()">×</button>
    <h3 id="driverModalTitle" data-i18n="tms.add_driver">เพิ่มคนขับ</h3>
    <form id="driverForm" onsubmit="return saveDriver(event)">
      <div class="form-grid2">
        <div class="form-row"><label>Username</label><input name="username" required pattern="[a-zA-Z0-9_]+"></div>
        <div class="form-row" id="driverPasswordRow"><label data-i18n="tms.col.password">รหัสผ่าน</label><input name="password" type="text" minlength="4" required></div>
      </div>
      <div class="form-row"><label data-i18n="tms.col.full_name">ชื่อ-นามสกุล</label><input name="full_name" required></div>
      <div class="form-grid2">
        <div class="form-row"><label data-i18n="tms.col.phone">โทร</label><input name="phone"></div>
        <div class="form-row"><label data-i18n="tms.col.plate">ทะเบียนรถ</label><input name="vehicle_plate"></div>
      </div>
      <p id="driverErr" style="color:var(--err);font-size:12px;min-height:18px;margin:8px 0"></p>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button type="button" class="btn ghost" onclick="closeDriver()" data-i18n="common.cancel">ยกเลิก</button>
        <button type="submit" class="btn" data-i18n="common.save">บันทึก</button>
      </div>
    </form>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
if (!requireLogin()) throw '';
const me = getUser();
const HQ_ROLES = ['super_admin','admin_scm'];
if (!me || !HQ_ROLES.includes(me.role)) {
  location.href = '/index.html'; throw '';
}
const isSuper = me.role === 'super_admin';
document.getElementById('nav').innerHTML = renderNav('tms-admin.html');

let carriersCache = [];
let driversCache = [];
let selectedCarrier = null;

async function loadCarriers() {
  try {
    carriersCache = await api('/api/tms/carriers');
    renderCarriers();
  } catch (e) { toast(e.message); }
}

function renderCarriers() {
  const el = document.getElementById('carrierBody');
  document.getElementById('carrierCount').textContent = carriersCache.length;
  if (!carriersCache.length) {
    el.innerHTML = `<tr><td colspan="8" class="empty">${t('tms.no_carriers')}</td></tr>`;
    return;
  }
  el.innerHTML = carriersCache.map(c => `
    <tr class="row-clickable ${selectedCarrier && selectedCarrier.id === c.id ? 'row-selected' : ''} ${c.active?'':'pill-off'}"
        style="${c.active?'':'opacity:.55'}"
        onclick="selectCarrier(${c.id})">
      <td><strong>${c.code}</strong></td>
      <td>${c.name}</td>
      <td>${c.contact_phone || '-'}</td>
      <td style="color:var(--muted)">${c.contact_email || '-'}</td>
      <td>${(c.default_cost_per_trip||0).toLocaleString()}</td>
      <td>${c.driver_count || 0}</td>
      <td>${c.active ? `<span class="pill-on">${t('tms.active')}</span>` : `<span class="pill-off">${t('tms.inactive')}</span>`}</td>
      <td onclick="event.stopPropagation()">
        <button class="btn sm ghost" onclick='openCarrierModal(${JSON.stringify(c).replace(/'/g,"&#39;")})'>${t('common.edit')}</button>
        ${isSuper ? `<button class="btn sm ghost" style="color:var(--err);border-color:var(--err);margin-left:4px" onclick="deleteCarrier(${c.id},'${c.code}')">${t('common.delete')}</button>` : ''}
      </td>
    </tr>
  `).join('');
}

function selectCarrier(id) {
  selectedCarrier = carriersCache.find(c => c.id === id) || null;
  renderCarriers();
  document.getElementById('driversFor').textContent = selectedCarrier ? ` · ${selectedCarrier.code} ${selectedCarrier.name}` : '';
  document.getElementById('btnAddDriver').disabled = !selectedCarrier;
  if (selectedCarrier) loadDrivers();
}

async function loadDrivers() {
  if (!selectedCarrier) return;
  try {
    driversCache = await api(`/api/tms/carriers/${selectedCarrier.id}/drivers`);
    renderDrivers();
  } catch (e) { toast(e.message); }
}

function renderDrivers() {
  const el = document.getElementById('driverBody');
  if (!driversCache.length) {
    el.innerHTML = `<tr><td colspan="6" class="empty">${t('tms.no_drivers')}</td></tr>`;
    return;
  }
  el.innerHTML = driversCache.map(d => `
    <tr style="${d.active?'':'opacity:.55'}">
      <td><strong>${d.username}</strong></td>
      <td>${d.full_name}</td>
      <td>${d.phone || '-'}</td>
      <td>${d.vehicle_plate || '-'}</td>
      <td>${d.active ? `<span class="pill-on">${t('tms.active')}</span>` : `<span class="pill-off">${t('tms.inactive')}</span>`}</td>
      <td>
        <button class="btn sm ghost" onclick='openDriverModal(${JSON.stringify(d).replace(/'/g,"&#39;")})'>${t('common.edit')}</button>
        <button class="btn sm ghost" onclick="resetDriverPassword(${d.id},'${d.username}')">${t('tms.reset_pw')}</button>
        ${isSuper ? `<button class="btn sm ghost" style="color:var(--err);border-color:var(--err);margin-left:4px" onclick="deleteDriver(${d.id},'${d.username}')">${t('common.delete')}</button>` : ''}
      </td>
    </tr>
  `).join('');
}

// ─── Carrier modal ───
function openCarrierModal(c) {
  const form = document.getElementById('carrierForm');
  form.reset();
  document.getElementById('carrierErr').textContent = '';
  const isEdit = !!c;
  document.getElementById('carrierModalTitle').textContent = isEdit ? t('tms.edit_carrier') : t('tms.add_carrier');
  if (isEdit) {
    form.code.value = c.code;
    form.code.readOnly = true;
    form.name.value = c.name || '';
    form.contact_phone.value = c.contact_phone || '';
    form.contact_email.value = c.contact_email || '';
    form.default_cost_per_trip.value = c.default_cost_per_trip || 0;
    form.note.value = c.note || '';
    form.dataset.editId = c.id;
  } else {
    form.code.readOnly = false;
    delete form.dataset.editId;
  }
  document.getElementById('carrierModal').style.display = 'flex';
}
function closeCarrier() { document.getElementById('carrierModal').style.display = 'none'; }

async function saveCarrier(e) {
  e.preventDefault();
  const form = e.target;
  const fd = new FormData(form);
  const body = Object.fromEntries(fd.entries());
  if (body.default_cost_per_trip === '') body.default_cost_per_trip = 0;
  try {
    if (form.dataset.editId) {
      delete body.code; // code is immutable
      await api('/api/tms/carriers/' + form.dataset.editId, { method:'PUT', body: JSON.stringify(body) });
    } else {
      await api('/api/tms/carriers', { method:'POST', body: JSON.stringify(body) });
    }
    toast('OK');
    closeCarrier();
    loadCarriers();
  } catch (err) {
    document.getElementById('carrierErr').textContent = err.message;
  }
  return false;
}

async function deleteCarrier(id, code) {
  if (!confirm(t('tms.confirm_delete_carrier', { code }))) return;
  try {
    const r = await api('/api/tms/carriers/' + id, { method: 'DELETE' });
    toast(r.soft_deleted ? t('tms.soft_deleted') : t('tms.deleted'));
    if (selectedCarrier && selectedCarrier.id === id) selectCarrier(null);
    loadCarriers();
  } catch (e) { toast(e.message); }
}

// ─── Driver modal ───
function openDriverModal(d) {
  if (!selectedCarrier) { toast(t('tms.select_carrier_first')); return; }
  const form = document.getElementById('driverForm');
  form.reset();
  document.getElementById('driverErr').textContent = '';
  const isEdit = !!d;
  document.getElementById('driverModalTitle').textContent = isEdit ? t('tms.edit_driver') : t('tms.add_driver');
  // Password is required on create, hidden on edit (use Reset PW button instead)
  document.getElementById('driverPasswordRow').style.display = isEdit ? 'none' : 'block';
  form.querySelector('input[name=password]').required = !isEdit;
  if (isEdit) {
    form.username.value = d.username;
    form.username.readOnly = true;
    form.full_name.value = d.full_name || '';
    form.phone.value = d.phone || '';
    form.vehicle_plate.value = d.vehicle_plate || '';
    form.dataset.editId = d.id;
  } else {
    form.username.readOnly = false;
    delete form.dataset.editId;
  }
  document.getElementById('driverModal').style.display = 'flex';
}
function closeDriver() { document.getElementById('driverModal').style.display = 'none'; }

async function saveDriver(e) {
  e.preventDefault();
  const form = e.target;
  const fd = new FormData(form);
  const body = Object.fromEntries(fd.entries());
  try {
    if (form.dataset.editId) {
      delete body.username; delete body.password;
      await api('/api/tms/drivers/' + form.dataset.editId, { method:'PUT', body: JSON.stringify(body) });
    } else {
      await api(`/api/tms/carriers/${selectedCarrier.id}/drivers`, { method:'POST', body: JSON.stringify(body) });
    }
    toast('OK');
    closeDriver();
    loadDrivers();
    loadCarriers(); // refresh driver_count column
  } catch (err) {
    document.getElementById('driverErr').textContent = err.message;
  }
  return false;
}

async function resetDriverPassword(id, username) {
  const p = prompt(t('tms.new_password_for', { username }));
  if (!p || p.length < 4) {
    if (p !== null) toast(t('tms.password_too_short'));
    return;
  }
  try {
    await api('/api/tms/drivers/' + id + '/reset-password', { method:'POST', body: JSON.stringify({ password: p }) });
    toast(t('tms.password_reset_ok'));
  } catch (e) { toast(e.message); }
}

async function deleteDriver(id, username) {
  if (!confirm(t('tms.confirm_delete_driver', { username }))) return;
  try {
    const r = await api('/api/tms/drivers/' + id, { method:'DELETE' });
    toast(r.soft_deleted ? t('tms.soft_deleted') : t('tms.deleted'));
    loadDrivers();
    loadCarriers();
  } catch (e) { toast(e.message); }
}

loadCarriers();
applyI18n(document.body);
</script>
</body></html>
