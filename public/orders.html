<!doctype html>
<html lang="th"><head>
<meta charset="utf-8"><title>คำสั่งซื้อ — JC-Market</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
.order-card{cursor:pointer;transition:.2s}
.order-card:hover{border-color:var(--gold)}
.status-badge{display:inline-block;padding:3px 12px;border-radius:99px;font-size:12px;font-weight:600}
.status-pending{background:#fff3e0;color:#e65100}
.status-paid{background:#e3f2fd;color:#1565c0}
.status-verified{background:#e8f5e9;color:#2e7d32}
.status-failed{background:#ffebee;color:#c62828}
.status-cancelled{background:#f5f5f5;color:#999}
.countdown{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:8px;font-size:14px;font-weight:700;background:#fff3e0;color:#e65100}
.countdown.urgent{background:#ffebee;color:#c62828;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.fulfill-badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:600;margin-left:6px}
.fulfill-pending{background:var(--beige);color:var(--muted)}
.fulfill-shipped{background:#e3f2fd;color:#1565c0}
.fulfill-partial{background:#fff3e0;color:#e65100}
.fulfill-received{background:#e8f5e9;color:#2e7d32}
.receive-line{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px}
.receive-line .name{flex:1}
.receive-line input[type=number]{width:80px;text-align:center}
.detail-modal{position:fixed;inset:0;background:rgba(24,24,24,.5);backdrop-filter:blur(4px);z-index:999;display:none;align-items:center;justify-content:center;overflow-y:auto;padding:20px}
.detail-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;max-width:600px;width:100%;max-height:90vh;overflow-y:auto;position:relative}
</style>
</head><body data-i18n-title="orders.page_title">
<div id="nav"></div>
<div class="container">
  <h2 style="margin-bottom:16px" data-i18n="orders.title">คำสั่งซื้อ</h2>
  <div id="orderList"></div>
</div>

<!-- Detail modal -->
<div id="detailModal" class="detail-modal" onclick="if(event.target===this)closeDetail()">
  <div class="detail-box">
    <button onclick="closeDetail()" style="position:absolute;top:12px;right:16px;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer">&times;</button>
    <div id="detailContent"></div>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
if(!requireLogin()) throw '';
if(!denyFinance()) throw '';
document.getElementById('nav').innerHTML = renderNav('orders.html');

const user = getUser();
const isAdmin = user && (user.role === 'super_admin' || user.role === 'admin_scm');

const CANCEL_TIMEOUT_MIN = 30;
function statusMap(){
  return {
    pending: {label:t('orders.status.pending'), cls:'status-pending'},
    paid: {label:t('orders.status.paid'), cls:'status-paid'},
    verified: {label:t('orders.status.verified'), cls:'status-verified'},
    failed: {label:t('orders.status.failed'), cls:'status-failed'},
    cancelled: {label:t('orders.status.cancelled'), cls:'status-cancelled'},
  };
}
function fulfillMap(){
  return {
    pending: {label:t('orders.fulfill.pending'), cls:'fulfill-pending'},
    shipped: {label:t('orders.fulfill.shipped'), cls:'fulfill-shipped'},
    partial: {label:t('orders.fulfill.partial'), cls:'fulfill-partial'},
    received: {label:t('orders.fulfill.received'), cls:'fulfill-received'},
  };
}

let currentDetailId = null;

async function load() {
  const orders = await api('/api/orders');
  if (!orders.length) {
    document.getElementById('orderList').innerHTML = `<div class="card" style="text-align:center;padding:40px;color:var(--muted)"><p style="font-size:48px">📋</p><p>${t('orders.empty')}</p></div>`;
    return;
  }
  const sMap = statusMap();
  const fMap = fulfillMap();
  document.getElementById('orderList').innerHTML = orders.map(o => {
    const st = sMap[o.payment_status] || {label:o.payment_status,cls:''};
    const fl = o.payment_status === 'verified' ? (fMap[o.fulfillment_status] || {label:'',cls:''}) : {label:'',cls:''};
    const isCancelled = o.payment_status === 'cancelled';
    let countdownHtml = '';
    if (o.payment_status === 'pending') {
      const remaining = getRemaining(o.created_at);
      if (remaining > 0) {
        const urgent = remaining < 5 * 60 * 1000;
        countdownHtml = `<span class="countdown ${urgent?'urgent':''}" data-expire="${new Date(o.created_at).getTime() + CANCEL_TIMEOUT_MIN*60*1000}">⏱ ${fmtCountdown(remaining)}</span>`;
      }
    }
    return `<div class="card order-card" style="${isCancelled?'opacity:.6':''}" onclick="showDetail('${o.id}')">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
        <div>
          <strong style="font-size:16px">${o.bc_po_no || o.order_number}</strong>
          <span style="color:var(--muted);font-size:12px;margin-left:6px">${o.order_number}</span>
          ${isAdmin ? `<span style="color:var(--muted);font-size:13px;margin-left:8px">${o.branch_name||o.user_name||''}</span>` : ''}
        </div>
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
          ${countdownHtml}
          <span class="status-badge ${st.cls}">${st.label}</span>
          ${fl.label ? `<span class="fulfill-badge ${fl.cls}">${fl.label}</span>` : ''}
        </div>
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:8px;color:var(--muted);font-size:13px">
        <span>${o.created_at}</span>
        <span style="color:${isCancelled?'var(--muted)':'var(--gold)'};font-weight:700;font-size:16px;${isCancelled?'text-decoration:line-through':''}">฿${o.total.toLocaleString()}</span>
      </div>
    </div>`;
  }).join('');
  startCountdownTimer();
}

async function showDetail(id) {
  currentDetailId = id;
  const o = await api('/api/orders/' + id);
  const sMap = statusMap();
  const fMap = fulfillMap();
  const st = sMap[o.payment_status] || {label:o.payment_status,cls:''};
  let html = `
    <h3 style="margin-bottom:4px">${o.bc_po_no || o.order_number}</h3>
    ${o.bc_po_no ? `<div style="color:var(--muted);font-size:12px;margin-bottom:4px">Ref: ${o.order_number}</div>` : ''}
    <span class="status-badge ${st.cls}">${st.label}</span>
    <div style="color:var(--muted);font-size:13px;margin:8px 0">${o.created_at}${o.branch_code?' | '+o.branch_code:''}</div>
    <hr style="border-color:var(--border);margin:12px 0">
    <h4 style="margin-bottom:8px">${t('orders.items')}</h4>
    <table style="width:100%;font-size:14px">
      <tr style="color:var(--muted)"><th style="text-align:left">${t('common.item')}</th><th>${t('common.qty')}</th><th style="text-align:right">${t('common.total')}</th></tr>
      ${o.lines.map(l => `<tr><td>${itemName(l)}<br><span style="color:var(--muted);font-size:11px">${l.item_no}</span></td><td style="text-align:center">${l.quantity}</td><td style="text-align:right;color:var(--gold)">฿${l.line_total.toLocaleString()}</td></tr>`).join('')}
    </table>
    <hr style="border-color:var(--border);margin:12px 0">
    <div style="display:flex;justify-content:space-between;font-size:14px;color:var(--muted)"><span>${t('orders.subtotal')}</span><span>฿${o.subtotal.toLocaleString()}</span></div>
    ${o.vat_amount > 0 ? `<div style="display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-top:4px"><span>${t('orders.vat')}</span><span>฿${o.vat_amount.toLocaleString()}</span></div>` : ''}
    <div style="display:flex;justify-content:space-between;font-size:20px;font-weight:700;margin-top:8px"><span>${t('orders.grand')}</span><span style="color:var(--gold)">฿${o.total.toLocaleString()}</span></div>`;

  if (o.note) html += `<div style="margin-top:12px;color:var(--muted);font-size:13px">${t('orders.note_prefix', { note: o.note })}</div>`;

  // Payment section for pending orders
  if (o.payment_status === 'pending') {
    const isCredit = o.payment_method === 'credit_7d';
    const remaining = getRemaining(o.created_at);
    const urgent = remaining > 0 && remaining < 5 * 60 * 1000;
    html += `<hr style="border-color:var(--border);margin:12px 0">
      <h4 style="margin-bottom:12px">${t('orders.pay')}</h4>`;
    if (isCredit) {
      // Credit orders count down to credit_due_at (7 days from checkout)
      // instead of the 30-min cancel timer. data-expire lets the existing
      // startCountdownTimer() loop refresh the text every second. Past the
      // due date the countdown shows "⚠ เกินกำหนด" but stays interactive —
      // FC can still upload a slip, they just can't place new fruit orders
      // until everything outstanding is settled.
      const dueMs = o.credit_due_at ? new Date(o.credit_due_at.replace(' ', 'T')).getTime() : 0;
      const remainingCredit = Math.max(0, dueMs - Date.now());
      const overdue = dueMs && Date.now() > dueMs;
      html += `<div style="text-align:center;padding:14px;margin-bottom:12px;background:${overdue?'#fee2e2':'#fef3c7'};border-radius:8px">
        <div style="font-size:14px;color:${overdue?'#991b1b':'#92400e'};font-weight:600">${overdue ? '⚠ ' + t('orders.credit_overdue') : '📅 ' + t('orders.credit_due')}</div>
        <div style="font-size:13px;margin-top:4px" data-expire="${dueMs}" data-credit-due="1">${overdue ? (o.credit_due_at || '') : '⏱ ' + fmtCountdown(remainingCredit)}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:4px">${o.credit_due_at || ''}</div>
      </div>`;
      setTimeout(() => startCountdownTimer(), 100);
    } else if (remaining > 0) {
      html += `<div style="text-align:center;margin-bottom:12px">
        <div class="countdown ${urgent?'urgent':''}" style="font-size:18px;display:inline-flex" id="modalCountdown" data-expire="${new Date(o.created_at).getTime() + CANCEL_TIMEOUT_MIN*60*1000}">⏱ ${fmtCountdown(remaining)}</div>
        <p style="font-size:12px;color:var(--muted);margin-top:4px">${t('orders.pay_hint')}</p>
      </div>`;
    } else {
      html += `<div style="text-align:center;padding:16px;color:var(--err)"><p style="font-size:24px">⏰</p><p>${t('orders.pay_timeout')}</p></div>`;
    }
    html += `<div style="text-align:center;margin-bottom:16px">
        <div style="font-size:24px;font-weight:700;color:var(--gold);margin-bottom:8px">฿${o.total.toLocaleString()}</div>
        <img id="payQr_${o.id}" src="" style="max-width:240px;border-radius:12px;background:#fff;padding:10px;display:none">
        <p style="font-size:12px;color:var(--muted);margin-top:8px">${t('orders.scan_qr')}</p>
        <div class="row" style="gap:8px;margin-top:8px;justify-content:center">
          <button class="btn ghost sm" onclick="saveOrderQR('${o.id}','${o.order_number}')">${t('checkout.save_qr')}</button>
          <button class="btn ghost sm" onclick="downloadOrderPDF('${o.id}')">${t('checkout.download_pdf')}</button>
        </div>
      </div>
      <div style="border:2px dashed var(--border);border-radius:12px;padding:20px;text-align:center;cursor:pointer" id="dropPay_${o.id}" onclick="document.getElementById('slipPay_${o.id}').click()">
        <input type="file" id="slipPay_${o.id}" accept="image/*,.pdf" style="display:none" onchange="previewPaySlip('${o.id}',this)">
        <p style="color:var(--muted)">${t('orders.upload_click')}</p>
        <p style="font-size:12px;color:var(--muted)">${t('orders.upload_types')}</p>
      </div>
      <img id="slipPrev_${o.id}" style="max-width:200px;border-radius:8px;margin:12px auto;display:none">
      <button class="btn" style="width:100%;margin-top:12px" id="payBtn_${o.id}" onclick="submitPaySlip('${o.id}')" disabled>${t('orders.send_slip')}</button>
      <div class="err" id="payErr_${o.id}"></div>`;
    // Cancel button
    html += `<button class="btn ghost" style="width:100%;margin-top:8px;color:var(--err);border-color:var(--err)" onclick="cancelOrder('${o.id}')">${t('orders.cancel_order')}</button>`;
    loadPayQR(o.id);
    setTimeout(() => startCountdownTimer(), 100);
  }

  // Rejected — show reason + allow re-upload (reuses the same dropPay/slipPay/payBtn IDs as 'pending')
  if (o.payment_status === 'failed') {
    const retry = o.slip_retry_count || 0;
    html += `<hr style="border-color:var(--border);margin:12px 0">
      <div style="background:#fee2e2;border-left:4px solid var(--err);padding:12px;border-radius:8px;margin-bottom:16px">
        <div style="font-weight:700;color:var(--err);margin-bottom:6px">${t('orders.reject_title')}</div>
        ${o.reject_reason ? `<div style="font-size:14px;margin-bottom:4px">${o.reject_reason}</div>` : ''}
        <div style="font-size:12px;color:var(--muted)">
          ${o.rejected_at ? `${t('orders.rejected_at')}: ${o.rejected_at}` : ''}
          ${o.rejected_by_name ? ` · ${t('orders.rejected_by')}: ${o.rejected_by_name}` : ''}
          ${retry > 0 ? ` · ${t('orders.retry_count', { n: retry })}` : ''}
        </div>
      </div>
      <h4 style="margin-bottom:12px">${t('orders.reupload_title')}</h4>
      <div style="text-align:center;margin-bottom:16px">
        <div style="font-size:24px;font-weight:700;color:var(--gold);margin-bottom:8px">฿${o.total.toLocaleString()}</div>
        <img id="payQr_${o.id}" src="" style="max-width:240px;border-radius:12px;background:#fff;padding:10px;display:none">
        <p style="font-size:12px;color:var(--muted);margin-top:8px">${t('orders.scan_qr')}</p>
      </div>
      <div style="border:2px dashed var(--border);border-radius:12px;padding:20px;text-align:center;cursor:pointer" id="dropPay_${o.id}" onclick="document.getElementById('slipPay_${o.id}').click()">
        <input type="file" id="slipPay_${o.id}" accept="image/*,.pdf" style="display:none" onchange="previewPaySlip('${o.id}',this)">
        <p style="color:var(--muted)">${t('orders.upload_click')}</p>
        <p style="font-size:12px;color:var(--muted)">${t('orders.upload_types')}</p>
      </div>
      <img id="slipPrev_${o.id}" style="max-width:200px;border-radius:8px;margin:12px auto;display:none">
      <button class="btn" style="width:100%;margin-top:12px" id="payBtn_${o.id}" onclick="submitPaySlip('${o.id}')" disabled>${t('orders.send_slip')}</button>
      <div class="err" id="payErr_${o.id}"></div>
      <button class="btn ghost" style="width:100%;margin-top:8px;color:var(--err);border-color:var(--err)" onclick="cancelOrder('${o.id}')">${t('orders.cancel_order')}</button>`;
    loadPayQR(o.id);
  }

  // Cancelled order info
  if (o.payment_status === 'cancelled') {
    html += `<hr style="border-color:var(--border);margin:12px 0">
      <div style="text-align:center;padding:16px;background:#f5f5f5;border-radius:8px">
        <p style="font-size:28px">🚫</p>
        <p style="font-weight:700;color:#999;margin:4px 0">${t('orders.cancelled_title')}</p>
        <p style="font-size:12px;color:var(--muted)">${o.cancel_reason || ''}</p>
        <p style="font-size:12px;color:var(--muted)">${o.cancelled_at || ''}</p>
      </div>
      <button class="btn" style="width:100%;margin-top:12px;background:var(--gold)" onclick="reorder('${o.id}')">${t('orders.reorder')}</button>`;
  }

  // Slip (already uploaded) — suppress for 'failed' since the re-upload UI is the primary action
  if (o.payment && o.payment.slip_path && o.payment_status !== 'failed') {
    html += `<hr style="border-color:var(--border);margin:12px 0"><h4>${t('orders.slip')}</h4>
      <img src="${o.payment.slip_path}" style="max-width:280px;border-radius:8px;margin-top:8px">`;
    if (o.payment.verified) html += `<p style="color:var(--ok);font-size:13px;margin-top:4px">${t('orders.verified_at', { at: o.payment.verified_at })}</p>`;
  }

  // FC cancel button for paid orders
  if (o.payment_status === 'paid') {
    html += `<button class="btn ghost" style="width:100%;margin-top:8px;color:var(--err);border-color:var(--err)" onclick="cancelOrder('${o.id}')">${t('orders.cancel_order')}</button>`;
  }

  // Admin verify buttons
  if (isAdmin && o.payment_status === 'paid') {
    html += `<hr style="border-color:var(--border);margin:12px 0">
      <h4>${t('orders.admin.verify')}</h4>
      <div class="row" style="margin-top:8px">
        <button class="btn" onclick="verify('${o.id}','approve')">${t('orders.admin.approve')}</button>
        <button class="btn ghost" style="color:var(--err);border-color:var(--err)" onclick="verify('${o.id}','reject')">${t('orders.admin.reject')}</button>
      </div>`;
  }

  // ─── Fulfillment section (for verified orders) ───
  if (o.payment_status === 'verified') {
    const fl = fMap[o.fulfillment_status] || {label:o.fulfillment_status,cls:''};
    html += `<hr style="border-color:var(--border);margin:12px 0">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <h4>${t('orders.fulfill_title')}</h4>
        <span class="fulfill-badge ${fl.cls}">${fl.label}</span>
      </div>`;

    if (o.fulfillment_status === 'pending' || o.fulfillment_status === 'shipped' || o.fulfillment_status === 'partial') {
      html += `<div id="receiveSection_${o.id}"><button class="btn" style="width:100%" onclick="loadReceiveForm('${o.id}')">${t('orders.receive')}</button></div>`;
    } else if (o.fulfillment_status === 'received') {
      html += `<div style="text-align:center;padding:12px;color:var(--ok)"><p style="font-size:24px">✅</p><p>${t('orders.received_ok')}</p>
        ${o.fully_received_at ? `<p style="font-size:12px;color:var(--muted)">${o.fully_received_at}</p>` : ''}</div>`;
    }

    // Show receipt history
    if (o.receipts && o.receipts.length) {
      html += `<div style="margin-top:12px"><h5 style="margin-bottom:8px;color:var(--muted)">${t('orders.history')}</h5>`;
      for (const r of o.receipts) {
        html += `<div class="card" style="padding:10px;margin-bottom:6px;font-size:13px">
          <div style="display:flex;justify-content:space-between"><strong>${r.receipt_number}</strong><span style="color:var(--muted)">${r.created_at}</span></div>
          <div style="color:var(--muted)">${t('orders.received_by')}: ${r.received_by_name||''}${r.note ? ' | '+r.note : ''}</div>
        </div>`;
      }
      html += `</div>`;
    }
  }

  // Receipt button (for verified orders)
  if (o.payment_status === 'verified') {
    html += `<hr style="border-color:var(--border);margin:12px 0">
      <button class="btn" style="width:100%;background:var(--ok);color:#fff" onclick="showReceipt('${o.id}')">${t('orders.view_receipt')}</button>`;
  }

  // BC info
  if (o.bc_po_no) {
    html += `<div style="margin-top:12px;color:var(--ok);font-size:13px">${t('orders.bc.po')}: ${o.bc_po_no}</div>`;
  }
  if (o.bc_so_no) {
    html += `<div style="margin-top:4px;color:var(--ok);font-size:13px">${t('orders.bc.so')}: ${o.bc_so_no}</div>`;
  }
  if (o.bc_invoice_no) {
    html += `<div style="margin-top:4px;color:var(--ok);font-size:13px">${t('orders.bc.invoice')}: ${o.bc_invoice_no} ${o.bc_posted?t('orders.bc.posted'):''}</div>`;
  }

  document.getElementById('detailContent').innerHTML = html;
  document.getElementById('detailModal').style.display = 'flex';
}

function closeDetail() {
  document.getElementById('detailModal').style.display = 'none';
  currentDetailId = null;
  // ถ้ามาจาก deep-link (?id=...) → กลับหน้าเดิม (เช่น admin.html) แทนที่จะแสดงรายการ orders ทั้งหมด
  const params = new URLSearchParams(window.location.search);
  if (params.get('id')) {
    const ref = document.referrer;
    if (ref && ref.includes('/admin.html')) { history.back(); return; }
    // referrer ไม่มี → ล้าง ?id ออกจาก URL เฉยๆ
    history.replaceState({}, '', '/orders.html');
  }
}

async function verify(id, action) {
  try {
    const r = await api(`/api/orders/${id}/verify`, { method:'POST', body: JSON.stringify({action}) });
    toast(r.message);
    closeDetail();
    load();
  } catch (e) { toast(e.message); }
}

async function loadPayQR(id) {
  try {
    const r = await api('/api/orders/' + id + '/qr');
    const img = document.getElementById('payQr_' + id);
    if (img && r.qr_data_url) { img.src = r.qr_data_url; img.style.display = 'inline-block'; }
  } catch (e) { console.log('QR load error:', e.message); }
}

function previewPaySlip(id, input) {
  const file = input.files[0];
  if (!file) return;
  document.getElementById('dropPay_' + id).style.borderColor = 'var(--ok)';
  document.getElementById('payBtn_' + id).disabled = false;
  if (file.type.startsWith('image/')) {
    const reader = new FileReader();
    reader.onload = e => {
      const img = document.getElementById('slipPrev_' + id);
      img.src = e.target.result; img.style.display = 'block';
    };
    reader.readAsDataURL(file);
  }
}

async function submitPaySlip(id) {
  const file = document.getElementById('slipPay_' + id).files[0];
  if (!file) return;
  const fd = new FormData();
  fd.append('slip', file);
  try {
    document.getElementById('payBtn_' + id).disabled = true;
    document.getElementById('payBtn_' + id).textContent = t('orders.uploading');
    const r = await fetch('/api/orders/' + id + '/slip', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + getToken() },

function getRemaining(createdAt) {
  const created = new Date(createdAt).getTime();
  const expireAt = created + CANCEL_TIMEOUT_MIN * 60 * 1000;
  return Math.max(0, expireAt - Date.now());
}

function fmtCountdown(ms) {
  if (ms <= 0) return '00:00';
  if (ms >= 3600000) {
    const days = Math.floor(ms / 86400000);
    const hours = Math.floor((ms % 86400000) / 3600000);
    return days > 0 ? `${days} วัน ${hours} ชม.` : `${hours} ชม.`;
  }
  const min = Math.floor(ms / 60000);
  const sec = Math.floor((ms % 60000) / 1000);
  return `${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

let countdownInterval = null;
function startCountdownTimer() {
  if (countdownInterval) clearInterval(countdownInterval);
  countdownInterval = setInterval(() => {
    const els = document.querySelectorAll('[data-expire]');
    if (!els.length) { clearInterval(countdownInterval); return; }
    let needReload = false;
    els.forEach(el => {
      const expire = parseInt(el.dataset.expire);
      const remaining = Math.max(0, expire - Date.now());
      const isCreditDue = el.dataset.creditDue === '1';
      el.textContent = '⏱ ' + fmtCountdown(remaining);
      // Credit countdown stays calm — no urgent pulse, no expiry redirect.
      // The order-listing reloads on its own pace and the FC can still pay.
      if (!isCreditDue && remaining < 5 * 60 * 1000) el.classList.add('urgent');
      if (remaining <= 0) {
        if (isCreditDue) {
          el.textContent = t('orders.credit_overdue');
        } else {
          el.textContent = t('orders.expired');
          needReload = true;
        }
      }
    });
    if (needReload) {
      clearInterval(countdownInterval);
      setTimeout(() => { closeDetail(); load(); }, 2000);
    }
  }, 1000);
}

    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      *{box-sizing:border-box;margin:0;padding:0}
      body{font-family:'Sarabun',sans-serif;padding:40px;color:#181818;max-width:800px;margin:0 auto}
      table{width:100%;border-collapse:collapse}
      th,td{padding:8px 6px}
      @media print{body{padding:20px}button{display:none!important}}
    </style>
  </head><body>
    ${content.innerHTML}
    <div style="text-align:center;margin-top:24px">
      <button onclick="window.print()" style="padding:10px 24px;font-size:14px;cursor:pointer;background:#AD9C82;color:#fff;border:none;border-radius:8px;font-family:inherit;font-weight:600">${t('orders.receipt.print_btn')}</button>
    </div>
  </body></html>`);
  win.document.close();
}

window.onLangChange = () => {
  document.getElementById('nav').innerHTML = renderNav('orders.html');
  load();
  if (currentDetailId && document.getElementById('detailModal').style.display === 'flex') {
    showDetail(currentDetailId);
  }
};

load().then(() => {
  // ถ้ามี ?id=<order_id> ใน URL → เปิด detail modal อัตโนมัติ (สำหรับ deep-link จาก admin.html)
  const orderId = new URLSearchParams(window.location.search).get('id');
  if (orderId) showDetail(orderId);
});
</script>
