<!doctype html>
<html lang="th"><head>
<meta charset="utf-8"><title>คำสั่งซื้อ — JC-Stock Market</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
.order-card{cursor:pointer;transition:.2s}
.order-card:hover{border-color:var(--gold)}
.status-badge{display:inline-block;padding:3px 12px;border-radius:99px;font-size:12px;font-weight:600}
.status-pending{background:#3d3015;color:#f59e0b}
.status-paid{background:#1e3a5f;color:#3b82f6}
.status-verified{background:#0f3d24;color:#22c55e}
.status-failed{background:#3d1515;color:#ef4444}
.detail-modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:999;display:none;align-items:center;justify-content:center;overflow-y:auto;padding:20px}
.detail-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;max-width:600px;width:100%;max-height:90vh;overflow-y:auto;position:relative}
</style>
</head><body>
<div id="nav"></div>
<div class="container">
  <h2 style="margin-bottom:16px">คำสั่งซื้อ</h2>
  <div id="orderList"></div>
</div>

<!-- Detail modal -->
<div id="detailModal" class="detail-modal" onclick="if(event.target===this)closeDetail()">
  <div class="detail-box">
    <button onclick="closeDetail()" style="position:absolute;top:12px;right:16px;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer">&times;</button>
    <div id="detailContent"></div>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
if(!requireLogin()) throw '';
document.getElementById('nav').innerHTML = renderNav('orders.html');

const user = getUser();
const isAdmin = user && user.role === 'admin';

const statusMap = {
  pending: {label:'รอชำระเงิน', cls:'status-pending'},
  paid: {label:'ส่งสลิปแล้ว', cls:'status-paid'},
  verified: {label:'อนุมัติแล้ว', cls:'status-verified'},
  failed: {label:'ปฏิเสธ', cls:'status-failed'},
};

async function load() {
  const orders = await api('/api/orders');
  if (!orders.length) {
    document.getElementById('orderList').innerHTML = '<div class="card" style="text-align:center;padding:40px;color:var(--muted)"><p style="font-size:48px">📋</p><p>ยังไม่มีคำสั่งซื้อ</p></div>';
    return;
  }
  document.getElementById('orderList').innerHTML = orders.map(o => {
    const st = statusMap[o.payment_status] || {label:o.payment_status,cls:''};
    return `<div class="card order-card" onclick="showDetail('${o.id}')">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
        <div>
          <strong style="font-size:16px">${o.order_number}</strong>
          ${isAdmin ? `<span style="color:var(--muted);font-size:13px;margin-left:8px">${o.branch_name||o.user_name||''}</span>` : ''}
        </div>
        <span class="status-badge ${st.cls}">${st.label}</span>
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:8px;color:var(--muted);font-size:13px">
        <span>${o.created_at}</span>
        <span style="color:var(--gold);font-weight:700;font-size:16px">฿${o.total.toLocaleString()}</span>
      </div>
    </div>`;
  }).join('');
}

async function showDetail(id) {
  const o = await api('/api/orders/' + id);
  const st = statusMap[o.payment_status] || {label:o.payment_status,cls:''};
  let html = `
    <h3 style="margin-bottom:4px">${o.order_number}</h3>
    <span class="status-badge ${st.cls}">${st.label}</span>
    <div style="color:var(--muted);font-size:13px;margin:8px 0">${o.created_at}${o.branch_code?' | '+o.branch_code:''}</div>
    <hr style="border-color:var(--border);margin:12px 0">
    <h4 style="margin-bottom:8px">รายการสินค้า</h4>
    <table style="width:100%;font-size:14px">
      <tr style="color:var(--muted)"><th style="text-align:left">สินค้า</th><th>จำนวน</th><th style="text-align:right">รวม</th></tr>
      ${o.lines.map(l => `<tr><td>${l.item_name}<br><span style="color:var(--muted);font-size:11px">${l.item_no}</span></td><td style="text-align:center">${l.quantity}</td><td style="text-align:right;color:var(--gold)">฿${l.line_total.toLocaleString()}</td></tr>`).join('')}
    </table>
    <hr style="border-color:var(--border);margin:12px 0">
    <div style="display:flex;justify-content:flex-end;font-size:20px;font-weight:700;color:var(--gold)">฿${o.total.toLocaleString()}</div>`;

  if (o.note) html += `<div style="margin-top:12px;color:var(--muted);font-size:13px">หมายเหตุ: ${o.note}</div>`;

  // Slip
  if (o.payment && o.payment.slip_path) {
    html += `<hr style="border-color:var(--border);margin:12px 0"><h4>สลิปการโอน</h4>
      <img src="${o.payment.slip_path}" style="max-width:280px;border-radius:8px;margin-top:8px">`;
    if (o.payment.verified) html += `<p style="color:var(--ok);font-size:13px;margin-top:4px">ตรวจสอบแล้ว ${o.payment.verified_at}</p>`;
  }

  // Admin verify buttons
  if (isAdmin && o.payment_status === 'paid') {
    html += `<hr style="border-color:var(--border);margin:12px 0">
      <h4>ตรวจสอบการชำระเงิน</h4>
      <div class="row" style="margin-top:8px">
        <button class="btn" onclick="verify('${o.id}','approve')">อนุมัติ</button>
        <button class="btn ghost" style="color:var(--err);border-color:var(--err)" onclick="verify('${o.id}','reject')">ปฏิเสธ</button>
      </div>`;
  }

  // BC info
  if (o.bc_invoice_no) {
    html += `<div style="margin-top:12px;color:var(--ok);font-size:13px">BC Invoice: ${o.bc_invoice_no} ${o.bc_posted?'(Posted)':''}</div>`;
  }

  document.getElementById('detailContent').innerHTML = html;
  document.getElementById('detailModal').style.display = 'flex';
}

function closeDetail() { document.getElementById('detailModal').style.display = 'none'; }

async function verify(id, action) {
  try {
    const r = await api(`/api/orders/${id}/verify`, { method:'POST', body: JSON.stringify({action}) });
    toast(r.message);
    closeDetail();
    load();
  } catch (e) { toast(e.message); }
}

load();
</script>
</body></html>
