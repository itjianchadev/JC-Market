<!doctype html>
<html lang="th"><head>
<meta charset="utf-8"><title>ใบวางบิล — JC-Market</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{font-family:Sarabun,sans-serif;color:#181818;background:#eceae6;margin:0;padding:20px}
.actions{max-width:780px;margin:0 auto 16px;text-align:right}
.btn{background:#AD9C82;color:#fff;border:none;padding:10px 22px;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.btn.ghost{background:#fff;color:#8a7d66;border:1px solid #d8d0c2}
.sheet{background:#fff;max-width:780px;margin:0 auto;padding:40px 44px;box-shadow:0 2px 12px rgba(0,0,0,.12);border-radius:6px}
.head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #AD9C82;padding-bottom:16px;margin-bottom:18px}
.brand{font-size:22px;font-weight:700;color:#8a7d66}
.doc-title{font-size:18px;font-weight:700;text-align:right}
.meta{font-size:13px;color:#555;line-height:1.6}
.parties{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:18px}
th{background:#f0ece4;text-align:left;padding:8px 10px;border-bottom:2px solid #AD9C82;font-size:12px;white-space:nowrap}
th.num,td.num{text-align:right}
td{padding:8px 10px;border-bottom:1px solid #eee;vertical-align:top}
tfoot td{font-weight:700;border-top:2px solid #AD9C82;background:#f0ece4}
@media print{ body{background:#fff;padding:0} .sheet{box-shadow:none;border-radius:0;max-width:100%;padding:24px 28px} .actions{display:none} }
</style>
</head><body>
<div class="actions">
  <button class="btn ghost" onclick="window.close()">ปิด</button>
  <button class="btn" onclick="window.print()">🖨️ พิมพ์ / บันทึก PDF</button>
</div>
<div class="sheet" id="sheet">กำลังโหลด…</div>
<script src="/js/app.js?v=20260604i"></script>
<script>
if(!requireLogin()) throw '';
const id=new URLSearchParams(location.search).get('id');
const money=n=>Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtDate=d=>d?new Date(d.replace(' ','T')).toLocaleDateString('th-TH',{day:'2-digit',month:'short',year:'numeric'}):'-';
const fmtDT=d=>d?new Date(d.replace(' ','T')).toLocaleString('th-TH',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'-';
const ST={pending:'รอชำระ',paid:'รอตรวจ',verified:'ชำระสำเร็จ',failed:'ไม่ผ่าน',cancelled:'ยกเลิก'};
(async()=>{
  try{
    const inv=await api('/api/credit-invoices/'+id);
    const orders=inv.orders||[];
    document.getElementById('sheet').innerHTML=`
      <div class="head">
        <div><div class="brand">🛍️ Jian Cha Co.,Ltd.</div><div class="meta">บริษัท เจี้ยนชา จำกัด</div></div>
        <div><div class="doc-title">ใบวางบิล / Billing Statement</div>
          <div class="meta" style="text-align:right">เลขที่ <strong>${inv.invoice_number}</strong>${inv.receipt_number?`<br>เลขรับเงิน ${inv.receipt_number}`:''}<br>วันที่ออก ${fmtDate(inv.created_at)}</div></div>
      </div>
      <div class="parties">
        <div class="meta"><strong>เรียกเก็บจาก</strong><br>${inv.branch_name||''} (${inv.branch_code})<br>รหัสลูกค้า BC: ${inv.bc_customer_no||inv.branch_code}</div>
        <div class="meta" style="text-align:right"><strong>กำหนดชำระ</strong><br>${fmtDT(inv.cycle_due)}<br>สถานะ: <strong>${ST[inv.status]||inv.status}</strong></div>
      </div>
      <table>
        <thead><tr><th>คำสั่งซื้อ</th><th>วันที่</th><th>BC SO</th><th>BC PO</th><th class="num">ยอด (บาท)</th></tr></thead>
        <tbody>${orders.map(o=>`<tr>
          <td>${o.order_number}</td><td>${fmtDate(o.created_at)}</td>
          <td>${o.bc_so_no||'-'}</td><td>${o.bc_po_no||'-'}</td>
          <td class="num">${money(o.total)}</td></tr>`).join('')}</tbody>
        <tfoot><tr><td colspan="4">รวม ${orders.length} คำสั่งซื้อ</td><td class="num">${money(inv.total)}</td></tr></tfoot>
      </table>
      <div class="meta" style="margin-top:18px;border-top:1px dashed #ddd;padding-top:12px">
        หมายเหตุ: ผลไม้สดยกเว้น VAT · กำหนดชำระทุกวันอังคาร ก่อนเวลา 12:00 น. · เมื่อโอนแล้วอัปโหลดสลิปในระบบเพื่อให้ Finance ตรวจสอบ</div>`;
    document.title='ใบวางบิล '+inv.invoice_number;
  }catch(e){ document.getElementById('sheet').innerHTML='<p style="color:#c00">โหลดไม่สำเร็จ: '+(e.message||e)+'</p>'; }
})();
</script>
</body></html>
