<!doctype html>
<html lang="th"><head>
<meta charset="utf-8"><title>ร้านค้า — JC-Market</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
.shop-layout{display:flex;gap:20px;min-height:calc(100vh - 80px)}
.sidebar{width:220px;flex-shrink:0}
.sidebar .cat-list{list-style:none;padding:0}
.sidebar .cat-list li{padding:10px 14px;border-radius:8px;cursor:pointer;color:var(--muted);font-size:14px;transition:.15s;display:flex;justify-content:space-between;align-items:center}
.sidebar .cat-list li:hover{background:var(--beige);color:var(--text)}
.sidebar .cat-list li.active{background:var(--gold);color:#fff;font-weight:600}
.sidebar .cat-list li .count{font-size:12px;opacity:.7}
.sidebar .cat-list li.group-header{margin-top:8px;font-weight:700;color:var(--gold-dark);font-size:13px;letter-spacing:.3px;text-transform:none}
.sidebar .cat-list li.group-header.active{background:var(--gold);color:#fff}
.sidebar .cat-list li.group-header .chev{display:inline-block;font-size:10px;width:12px;color:var(--muted);transition:transform .15s;flex-shrink:0}
.sidebar .cat-list li.group-header.active .chev{color:#fff}
.sidebar .cat-list li.group-header .grp-label{display:flex;align-items:center;gap:8px;flex:1}
.sidebar .cat-list li.group-header .grp-icon{display:inline-flex;width:18px;height:18px;color:currentColor;flex-shrink:0}
.sidebar .cat-list li.group-header .grp-icon svg{width:100%;height:100%}
.sidebar .cat-list li.sub{padding-left:38px;font-size:13px}
.main-area{flex:1;min-width:0}
/* Item list table */
.item-table{width:100%;border-collapse:separate;border-spacing:0}
.item-table thead th{position:sticky;top:0;background:var(--beige);color:var(--gold-dark);font-size:13px;font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--gold)}
.item-table tbody tr{cursor:pointer;transition:.15s}
.item-table tbody tr:hover{background:rgba(173,156,130,.1)}
.item-table tbody tr:nth-child(even){background:var(--beige)}
.item-table tbody td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:14px;vertical-align:middle}
.item-table .col-no{width:120px;color:var(--muted);font-size:13px}
.item-table .col-name{font-weight:600}
.item-table .col-price{color:var(--gold-dark);font-weight:700;white-space:nowrap}
.item-table .col-uom{color:var(--muted);font-size:13px;width:80px}
.item-table .col-stock{width:120px}
.item-table .col-action{width:100px;text-align:center}
.stock-badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}
.stock-badge.ok{background:#e8f5e9;color:var(--ok)}
.stock-badge.low{background:#ffebee;color:var(--err)}
/* Modal overlay */
#modal .card{background:var(--card);border:1px solid var(--border);box-shadow:0 8px 30px rgba(0,0,0,.15)}
/* Responsive */
@media(max-width:1024px){.sidebar{width:180px}}
@media(max-width:768px){
  .shop-layout{flex-direction:column}.sidebar{width:100%}
  .sidebar .cat-list{display:flex;overflow-x:auto;gap:6px;padding-bottom:8px}
  .sidebar .cat-list li{white-space:nowrap;flex-shrink:0;padding:8px 12px;font-size:13px}
  .item-table{font-size:13px}
  .item-table thead th,.item-table tbody td{padding:8px 6px}
  .item-table .col-no{width:80px}
  .item-table .col-action{width:70px}
}
@media(max-width:480px){
  .item-table .col-no{display:none}
  .item-table thead th:first-child{display:none}
  .item-table .col-uom{width:50px}
  .item-table .col-stock{width:60px}
  .item-table thead th,.item-table tbody td{padding:6px 4px;font-size:12px}
  .stock-badge{padding:2px 6px;font-size:11px}
}
/* iOS-style switch for the "hide out-of-stock" toggle in the search bar */
.switch{position:relative;display:inline-block;width:40px;height:22px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.switch .slider{position:absolute;cursor:pointer;inset:0;background:#ccc;transition:.25s;border-radius:22px}
.switch .slider:before{position:absolute;content:"";height:16px;width:16px;left:3px;bottom:3px;background:#fff;transition:.25s;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked + .slider{background:var(--gold)}
.switch input:checked + .slider:before{transform:translateX(18px)}
.search-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.search-row #q{flex:1;min-width:200px}
.toggle-label{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;font-size:13px;color:var(--muted);white-space:nowrap}
</style>
</head><body data-i18n-title="shop.page_title">
<div id="nav"></div>
<div class="container">
  <div id="overdueCreditBanner" style="display:none;margin-bottom:16px;padding:12px 16px;background:#fee2e2;border-left:4px solid var(--err);border-radius:8px;color:#7f1d1d;font-size:14px"></div>
  <div class="shop-layout">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="card" style="padding:12px">
        <h4 style="margin-bottom:10px;color:var(--gold)" data-i18n="shop.categories">หมวดหมู่</h4>
        <ul id="catList" class="cat-list"></ul>
      </div>
      <div class="card" style="padding:12px;margin-top:12px">
        <div id="syncInfo" style="font-size:11px;color:var(--muted);white-space:pre-line"></div>
      </div>
    </div>
    <!-- Main -->
    <div class="main-area">
      <div class="card" style="padding:12px">
        <div class="search-row">
          <input id="q" data-i18n-placeholder="shop.search_placeholder" placeholder="ค้นหาสินค้า...">
          <label id="oosToggle" class="toggle-label" title="ซ่อนสินค้าที่คงเหลือเป็น 0">
            <span class="switch"><input type="checkbox" id="hideOos"><span class="slider"></span></span>
            <span data-i18n="shop.hide_oos">ซ่อนสินค้าหมด</span>
          </label>
        </div>
      </div>
      <div style="margin:12px 0 8px;color:var(--muted);font-size:13px" id="resultInfo"></div>
      <div class="card" style="padding:0;overflow-x:auto">
        <table class="item-table" id="items">
          <thead>
            <tr>
              <th data-i18n="shop.col.code">รหัส</th>
              <th data-i18n="shop.col.name">ชื่อสินค้า</th>
              <th data-i18n="shop.col.price">ราคา</th>
              <th data-i18n="shop.col.stock">คงเหลือ</th>
              <th data-i18n="shop.col.uom">หน่วย</th>
              <th style="text-align:center" data-i18n="shop.col.action">สั่งซื้อ</th>
            </tr>
          </thead>
          <tbody id="itemBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Add to cart modal -->
<div id="modal" style="display:none;position:fixed;inset:0;background:rgba(42,33,24,.5);backdrop-filter:blur(4px);z-index:999;align-items:center;justify-content:center">
  <div class="card" style="max-width:380px;width:90%;margin:auto;position:relative">
    <button onclick="closeModal()" style="position:absolute;top:12px;right:16px;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer">&times;</button>
    <h3 id="mName" style="margin-bottom:4px"></h3>
    <div id="mMeta" style="color:var(--muted);font-size:13px;margin-bottom:12px"></div>
    <div id="mPrice" style="color:var(--gold);font-size:24px;font-weight:700;margin-bottom:16px"></div>
    <label data-i18n="common.qty">จำนวน</label>
    <div class="row" style="align-items:center;margin-bottom:16px">
      <button class="btn sm ghost" onclick="adjQty(-1)">-</button>
      <input id="mQty" type="number" min="1" value="1" style="text-align:center;width:80px">
      <button class="btn sm ghost" onclick="adjQty(1)">+</button>
      <span id="mStock" style="color:var(--muted);font-size:12px;margin-left:8px"></span>
    </div>
    <button class="btn" style="width:100%" onclick="addToCart()" data-i18n="shop.modal.add">เพิ่มลงตะกร้า</button>
    <div class="err" id="mErr"></div>
  </div>
</div>

<!-- Order history modal (admin only) -->
<div id="historyModal" style="display:none;position:fixed;inset:0;background:rgba(42,33,24,.5);backdrop-filter:blur(4px);z-index:999;align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto">
  <div class="card" style="max-width:760px;width:100%;margin:auto;position:relative">
    <button onclick="closeHistory()" style="position:absolute;top:12px;right:16px;background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer">&times;</button>
    <h3 id="hName" style="margin-bottom:4px"></h3>
    <div id="hMeta" style="color:var(--muted);font-size:13px;margin-bottom:4px"></div>
    <div id="hTotal" style="color:var(--gold-dark);font-size:13px;margin-bottom:12px;font-weight:600"></div>
    <div style="overflow-x:auto;max-height:60vh">
      <table class="item-table" style="font-size:13px">
        <thead><tr>
          <th data-i18n="history.order_no">เลขที่</th>
          <th data-i18n="history.branch">สาขา</th>
          <th data-i18n="history.qty" style="text-align:center">จำนวน</th>
          <th data-i18n="history.unit_price" style="text-align:right">ราคา/หน่วย</th>
          <th data-i18n="history.line_total" style="text-align:right">รวม</th>
          <th data-i18n="history.payment">สถานะ</th>
          <th data-i18n="history.date">วันที่</th>
        </tr></thead>
        <tbody id="hBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="/js/app.js?v=20260729"></script>
<script>
if(!requireLogin()) throw '';
if(!denyFinance()) throw '';
if(!denyPortal()) throw '';
document.getElementById('nav').innerHTML = renderNav('index.html');

const me = getUser();
// Roles that can toggle item visibility (SCM control of what owners see).
const VIS_ROLES = ['super_admin', 'admin_scm', 'test_superadmin', 'test_adminscm'];
const canToggleVis = !!(me && VIS_ROLES.includes(me.role));
const isAdminView = canToggleVis;

let selectedItem = null;
let activeCat = '';      // selected sub-category code (mutually exclusive with activeGroup)
let activeGroup = '';    // selected top-level group: '' | 'general' | 'fruit'
let expandedGroup = '';  // which group's sub-cats are currently shown (accordion, one at a time)
let allItems = [];
let categories = [];

// Inline SVG icons for the sidebar group headers — Lucide-style, currentColor
// so they pick up the row's text colour (gold-dark normally, white when active).
const GROUP_ICONS = {
  general: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>`,
  fruit:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.94c1.5 0 2.75 1.06 4 1.06 3 0 6-8 6-12.22A4.91 4.91 0 0 0 17 5c-2.22 0-4 1.44-5 2-1-.56-2.78-2-5-2a4.9 4.9 0 0 0-5 4.78C2 14 5 22 8 22c1.25 0 2.5-1.06 4-1.06Z"/><path d="M10 2c1 .5 2 2 2 5"/></svg>`,
};

// Adjust table header for admin — replace "สั่งซื้อ" with "สั่งล่าสุด" + "ประวัติ"
if (isAdminView) {
  const thead = document.querySelector('#items thead tr');
  thead.innerHTML = `
    <th data-i18n="shop.col.code">รหัส</th>
    <th data-i18n="shop.col.name">ชื่อสินค้า</th>
    <th data-i18n="shop.col.price">ราคา</th>
    <th data-i18n="shop.col.stock">คงเหลือ</th>
    <th data-i18n="shop.col.uom">หน่วย</th>
    <th data-i18n="shop.col.last_order">สั่งล่าสุด</th>
    <th style="text-align:center"></th>
    <th style="text-align:center">${getLang()==='th'?'แสดงหน้า Owner':'Show to Owner'}</th>`;
  applyI18n(thead);
} else {
  // FC catalog hides no-price / out-of-stock items permanently (see renderItems),
  // so the manual "hide out-of-stock" toggle is redundant for branches.
  const oosToggle = document.getElementById('oosToggle');
  if (oosToggle) oosToggle.style.display = 'none';
}

function fmtRelDate(isoStr){
  if (!isoStr) return '';
  const d = new Date(isoStr);
  if (isNaN(d.getTime())) return isoStr;
  const locale = getLang() === 'th' ? 'th-TH' : 'en-US';
  return d.toLocaleDateString(locale, { year:'2-digit', month:'short', day:'numeric' });
}

async function loadAll() {
  allItems = await api('/api/items?' + new URLSearchParams({q:'',category:''}));
  // Build category counts (keyed by original code so switching language stays stable)
  const catMap = {};
  allItems.forEach(it => {
    const c = it.category || 'Other';
    catMap[c] = (catMap[c]||0) + 1;
  });
  categories = Object.entries(catMap).sort((a,b) => catName(a[0]).localeCompare(catName(b[0])));
  renderCats();
  renderItems();
}

function renderCats() {
  const total = allItems.length;
  const allActive = activeCat==='' && activeGroup==='';
  let html = `<li class="${allActive?'active':''}" onclick="setAll()">${t('common.all')} <span class="count">${total}</span></li>`;

  // Bucket sub-categories under their top-level group
  const buckets = { general: [], fruit: [] };
  let groupTotals = { general: 0, fruit: 0 };
  for (const [cat, count] of categories) {
    const g = categoryGroup(cat);
    buckets[g].push([cat, count]);
    groupTotals[g] += count;
  }

  for (const groupKey of ['general', 'fruit']) {
    if (!buckets[groupKey].length) continue;
    const groupLabel = t('shop.group_' + groupKey);
    const groupActive = activeGroup === groupKey;
    const isOpen = expandedGroup === groupKey;
    const chevron = isOpen ? '▼' : '▶';
    const icon = GROUP_ICONS[groupKey] || '';
    html += `<li class="group-header ${groupActive?'active':''}" onclick="toggleGroup('${groupKey}')"><span class="chev">${chevron}</span><span class="grp-label"><span class="grp-icon">${icon}</span>${groupLabel}</span><span class="count">${groupTotals[groupKey]}</span></li>`;
    if (isOpen) {
      for (const [cat, count] of buckets[groupKey]) {
        const safe = cat.replace(/'/g, "\\'");
        html += `<li class="sub ${activeCat===cat?'active':''}" onclick="setCat('${safe}')">${catName(cat)} <span class="count">${count}</span></li>`;
      }
    }
  }
  document.getElementById('catList').innerHTML = html;
}

function setAll(){ activeCat=''; activeGroup=''; expandedGroup=''; renderCats(); renderItems(); }
// Click on a group header — accordion toggle + filter. Clicking the open group
// again collapses it and resets the filter; clicking a different (or closed)
// group expands it and filters items to that group.
function toggleGroup(g){
  if (expandedGroup === g) { expandedGroup = ''; activeGroup = ''; }
  else { expandedGroup = g; activeGroup = g; }
  activeCat = '';
  renderCats();
  renderItems();
}
function setCat(cat) {
  activeCat = cat;
  activeGroup = '';
  renderCats();
  renderItems();
}

function renderItems() {
  const q = (document.getElementById('q').value || '').toLowerCase();
  const hideOos = document.getElementById('hideOos').checked;
  let oosHidden = 0;
  let filtered = allItems.filter(it => {
    if (activeCat && (it.category||'Other') !== activeCat) return false;
    if (activeGroup && categoryGroup(it.category||'Other') !== activeGroup) return false;
    if (q) {
      const hay = ((it.name||'') + ' ' + (it.name_en||'') + ' ' + (it.item_no||'')).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    // Branch catalog hides items with no price or no stock (team request);
    // admin view keeps everything so HQ can audit price/stock coverage.
    if (!isAdminView && (!(it.unit_price > 0) || it.inventory <= 0)) return false;
    if (hideOos && it.inventory <= 0) { oosHidden++; return false; }
    return true;
  });
  const baseInfo = activeCat
    ? t('shop.showing_cat', { n: filtered.length, cat: catName(activeCat) })
    : activeGroup
      ? t('shop.showing_cat', { n: filtered.length, cat: t('shop.group_' + activeGroup) })
      : t('shop.showing', { n: filtered.length });
  document.getElementById('resultInfo').textContent = oosHidden > 0
    ? `${baseInfo} · ${t('shop.oos_hidden', { n: oosHidden })}`
    : baseInfo;
  const el = document.getElementById('itemBody');
  if (!filtered.length) { el.innerHTML = `<tr><td colspan="${isAdminView?8:6}" style="color:var(--muted);padding:20px;text-align:center">${t('shop.no_items')}</td></tr>`; return; }

  const noPriceLabel = t('shop.no_price');
  const priceCell = it => (it.unit_price > 0)
    ? `฿${it.unit_price.toLocaleString()}`
    : `<span style="color:var(--muted);font-size:12px">${noPriceLabel}</span>`;

  if (isAdminView) {
    const never = t('shop.never_ordered');
    const histBtn = t('shop.btn_history');
    el.innerHTML = filtered.map(it => {
      const lo = it.last_order;
      const lastCell = lo ? `
        <div style="font-weight:600">${lo.branch_code||'-'}</div>
        <div style="color:var(--muted);font-size:11px">${fmtRelDate(lo.created_at)} · ${lo.quantity} ${it.uom||''}</div>
        <div style="color:var(--muted);font-size:11px">${lo.bc_po_no||lo.order_number}</div>
      ` : `<span style="color:var(--muted)">${never}</span>`;
      return `
      <tr onclick='openHistory("${it.item_no}", ${JSON.stringify(it).replace(/'/g,"&#39;")})' style="cursor:pointer">
        <td class="col-no">${it.item_no}</td>
        <td class="col-name">${itemName(it)}</td>
        <td class="col-price">${priceCell(it)}</td>
        <td class="col-stock"><span class="stock-badge ${it.inventory<=0?'low':'ok'}">${it.inventory}</span></td>
        <td class="col-uom">${it.uom}</td>
        <td style="font-size:12px">${lastCell}</td>
        <td class="col-action"><button class="btn sm ghost" onclick='event.stopPropagation();openHistory("${it.item_no}", ${JSON.stringify(it).replace(/'/g,"&#39;")})'>${histBtn}</button></td>
        <td style="text-align:center" onclick="event.stopPropagation()" title="${getLang()==='th'?'เปิด = แสดงให้ owner เห็น / ปิด = ซ่อน':'On = visible to owner / Off = hidden'}">
          <label class="switch"><input type="checkbox" ${it.scm_hidden ? '' : 'checked'} onchange="toggleItemVis('${it.item_no}', this)"><span class="slider"></span></label>
        </td>
      </tr>`;
    }).join('');
    return;
  }

  const oosLabel = t('shop.out_of_stock');
  const orderLabel = t('shop.btn_order');
  const noPriceBtn = t('shop.no_price_btn');
  el.innerHTML = filtered.map(it => {
    const oos = it.inventory <= 0;
    const noPrice = !oos && (!it.unit_price || it.unit_price <= 0);
    const disabled = oos || noPrice;
    const rowClick = oos ? "alertOutOfStock()" : noPrice ? "alertNoPrice()" : "openModal("+JSON.stringify(it).replace(/'/g,"&#39;")+")";
    const btnLabel = oos ? oosLabel : noPrice ? noPriceBtn : orderLabel;
    const btnColor = disabled ? 'var(--err)' : 'var(--ok)';
    return `
    <tr onclick='${rowClick}' style="${disabled?'opacity:.6;cursor:not-allowed':'cursor:pointer'}">
      <td class="col-no">${it.item_no}</td>
      <td class="col-name">${itemName(it)}</td>
      <td class="col-price">${priceCell(it)}</td>
      <td class="col-stock"><span class="stock-badge ${oos?'low':'ok'}">${it.inventory}</span></td>
      <td class="col-uom">${it.uom}</td>
      <td class="col-action"><button class="btn sm" style="background:${btnColor};color:#fff" onclick='event.stopPropagation();${rowClick}'>${btnLabel}</button></td>
    </tr>`;
  }).join('');
}

// ─── SCM: toggle whether an item shows to branch owners ───
// checked = visible to owner · unchecked = hidden. Persists via scm_hidden
// (survives BC sync). Restricted server-side to SCM / Super Admin roles.
async function toggleItemVis(itemNo, inputEl) {
  const show = inputEl.checked;
  inputEl.disabled = true;
  try {
    await api('/api/admin/items/' + encodeURIComponent(itemNo) + '/visibility',
      { method: 'PATCH', body: JSON.stringify({ hidden: !show }) });
    const it = allItems.find(x => x.item_no === itemNo);
    if (it) it.scm_hidden = show ? 0 : 1;
  } catch (e) {
    inputEl.checked = !show; // revert on failure
    alert(e.message || 'error');
  } finally {
    inputEl.disabled = false;
  }
}

// ─── Admin: open history modal ───
async function openHistory(itemNo, item) {
  try {
    document.getElementById('hName').textContent = itemName(item);
    const priceTxt = (item.unit_price > 0) ? `฿${item.unit_price.toLocaleString()}` : t('shop.no_price');
    document.getElementById('hMeta').textContent = `${item.item_no} | ${catName(item.category)} | ${priceTxt} / ${item.uom||''}`;
    document.getElementById('hBody').innerHTML = `<tr><td colspan="7" style="text-align:center;padding:20px;color:var(--muted)">${t('common.loading')}</td></tr>`;
    document.getElementById('historyModal').style.display = 'flex';
    const rows = await api('/api/admin/items/' + encodeURIComponent(itemNo) + '/history');
    document.getElementById('hTotal').textContent = t('history.total_orders', { n: rows.length });
    if (!rows.length) {
      document.getElementById('hBody').innerHTML = `<tr><td colspan="7" style="text-align:center;padding:20px;color:var(--muted)">${t('history.none')}</td></tr>`;
      return;
    }
    const payLabel = s => ({pending:'รอชำระ',paid:'รอตรวจ',verified:'ชำระแล้ว',failed:'ไม่ผ่าน',cancelled:'ยกเลิก'}[s] || s);
    const payLabelEn = s => ({pending:'Pending',paid:'To Review',verified:'Paid',failed:'Failed',cancelled:'Cancelled'}[s] || s);
    const fmt = getLang() === 'th' ? payLabel : payLabelEn;
    const locale = getLang() === 'th' ? 'th-TH' : 'en-US';
    document.getElementById('hBody').innerHTML = rows.map(r => `
      <tr style="${r.payment_status==='cancelled'?'opacity:.6':''}">
        <td><strong>${r.bc_po_no||r.order_number}</strong><br><span style="color:var(--muted);font-size:11px">${r.order_number}</span></td>
        <td><strong>${r.branch_code||'-'}</strong><br><span style="color:var(--muted);font-size:11px">${r.branch_name||''}</span></td>
        <td style="text-align:center;font-weight:600">${r.quantity}</td>
        <td style="text-align:right">฿${(r.unit_price||0).toLocaleString()}</td>
        <td style="text-align:right;color:var(--gold-dark);font-weight:600">฿${(r.line_total||0).toLocaleString()}</td>
        <td>${fmt(r.payment_status)}</td>
        <td style="color:var(--muted);font-size:12px">${new Date(r.created_at).toLocaleString(locale,{year:'2-digit',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}</td>
      </tr>
    `).join('');
  } catch (e) { toast(e.message); }
}

function closeHistory() { document.getElementById('historyModal').style.display = 'none'; }
document.addEventListener('click', (e) => {
  const m = document.getElementById('historyModal');
  if (e.target === m) closeHistory();
});

function alertOutOfStock() {
  toast(t('shop.oos_alert'));
}

function alertNoPrice() {
  toast(t('shop.no_price_alert'));
}

// Units that can be ordered in fractional amounts (e.g. 0.5 KG). Everything
// else (PCS, BOX, UNIT…) stays whole-number.
const FRACTIONAL_UOMS = ['KG'];
function qtyStep(uom) {
  return FRACTIONAL_UOMS.includes(String(uom || '').toUpperCase()) ? 0.5 : 1;
}

function openModal(item) {
  selectedItem = item;
  document.getElementById('mName').textContent = itemName(item);
  document.getElementById('mMeta').textContent = `${item.item_no} | ${catName(item.category)}`;
  document.getElementById('mPrice').textContent = `฿${item.unit_price.toLocaleString()} /${item.uom}`;
  document.getElementById('mStock').textContent = t('shop.modal.remaining', { n: item.inventory, uom: item.uom });
  const qtyInput = document.getElementById('mQty');
  const step = qtyStep(item.uom);
  qtyInput.step = step;
  qtyInput.min = step;
  qtyInput.value = 1;
  qtyInput.max = item.inventory;
  qtyInput.oninput = updateModalStock;
  document.getElementById('mErr').textContent = '';
  updateModalStock();
  document.getElementById('modal').style.display = 'flex';
}

function closeModal() { document.getElementById('modal').style.display = 'none'; selectedItem = null; }

function adjQty(d) {
  const inp = document.getElementById('mQty');
  const step = qtyStep(selectedItem.uom);
  let v = (parseFloat(inp.value) || step) + d * step;
  v = Math.max(step, Math.min(selectedItem.inventory, v));
  inp.value = Math.round(v * 100) / 100;
  updateModalStock();
}

function updateModalStock() {
  if (!selectedItem) return;
  const qty = parseFloat(document.getElementById('mQty').value) || qtyStep(selectedItem.uom);
  const remaining = Math.max(0, selectedItem.inventory - qty);
  const el = document.getElementById('mStock');
  el.textContent = t('shop.modal.remaining', { n: remaining, uom: selectedItem.uom });
  el.style.color = remaining <= 0 ? 'var(--err)' : 'var(--muted)';
}

async function addToCart() {
  if (!selectedItem) return;
  const qty = parseFloat(document.getElementById('mQty').value) || qtyStep(selectedItem.uom);
  try {
    await api('/api/cart/add', { method:'POST', body: JSON.stringify({ item_no: selectedItem.item_no, quantity: qty }) });
    toast(t('shop.added', { name: itemName(selectedItem), qty }));
    closeModal();
    updateCartBadge();
  } catch (e) {
    document.getElementById('mErr').textContent = e.message;
  }
}

async function loadSyncInfo() {
  try {
    const s = await api('/api/sync/status');
    if (s) document.getElementById('syncInfo').textContent = t('sync.info', { at: s.created_at, n: s.count });
  } catch {}
}

// Re-render on language change
window.onLangChange = () => {
  document.getElementById('nav').innerHTML = renderNav('index.html');
  renderCats();
  renderItems();
  loadSyncInfo();
  if (selectedItem) updateModalStock();
};

document.getElementById('q').oninput = () => { clearTimeout(window._t); window._t=setTimeout(renderItems,200); };
document.getElementById('modal').onclick = (e) => { if(e.target.id==='modal') closeModal(); };

// Restore "hide out-of-stock" toggle from previous session + persist on change
document.getElementById('hideOos').checked = localStorage.getItem('shop.hideOos') === '1';
document.getElementById('hideOos').onchange = (e) => {
  localStorage.setItem('shop.hideOos', e.target.checked ? '1' : '0');
  renderItems();
};

loadAll(); loadSyncInfo(); updateCartBadge();
</script>
</body></html>
