<!doctype html>
<html lang="th"><head>
<meta charset="utf-8"><title>พิมพ์ใบ PO — JC-Market</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Print document — keeps #181818 on paper on purpose (see CLAUDE.md). */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;background:#eceae6;color:#181818;font-size:13px}
.toolbar{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #ddd;padding:10px 20px;display:flex;align-items:center;gap:12px}
.toolbar .btn{padding:9px 20px;font-size:14px;cursor:pointer;background:#AD9C82;color:#fff;border:none;border-radius:8px;font-family:inherit;font-weight:600}
.toolbar .btn:hover{background:#8a7d66}
.toolbar .btn.ghost{background:#fff;color:#8a7d66;border:1px solid #d6cfc1}
.toolbar .info{color:#7a6e62;font-size:13px}
.sheet{background:#fff;width:210mm;min-height:297mm;margin:16px auto;padding:16mm 15mm;box-shadow:0 2px 12px rgba(0,0,0,.12);position:relative}
.hdr{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #181818;padding-bottom:10px;margin-bottom:14px}
.hdr .co{font-size:17px;font-weight:700}
.hdr .co small{display:block;font-size:11px;font-weight:400;color:#555;margin-top:2px}
.hdr .title{text-align:right}
.hdr .title h1{font-size:22px;letter-spacing:.5px}
.hdr .title .en{font-size:12px;color:#555}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px 24px;margin-bottom:14px}
.box{border:1px solid #bbb;border-radius:6px;padding:8px 10px}
.box .lbl{font-size:10px;color:#666;text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
.box .val{font-size:13px;font-weight:600}
.box .sub{font-size:11px;color:#444;margin-top:1px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12px}
.kv b{font-weight:600;color:#333}
table{width:100%;border-collapse:collapse;margin-top:6px}
th{background:#f1ede6;border:1px solid #bbb;padding:6px;font-size:11px;text-align:left;font-weight:600}
td{border:1px solid #bbb;padding:6px;vertical-align:top}
td.num,th.num{text-align:right;white-space:nowrap}
td.ctr,th.ctr{text-align:center}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:11px}
.totals{margin-left:auto;width:62mm;margin-top:10px}
.totals td{padding:5px 8px;border:none;border-bottom:1px solid #ddd}
.totals tr.grand td{font-weight:700;font-size:14px;border-top:2px solid #181818;border-bottom:2px solid #181818}
.note{margin-top:12px;font-size:11px;color:#444}
.sign{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:38px}
.sign div{text-align:center;font-size:11px;color:#333}
.sign .line{border-bottom:1px dotted #555;height:30px;margin-bottom:6px}
.foot{position:absolute;left:15mm;right:15mm;bottom:10mm;font-size:10px;color:#777;text-align:center;font-style:italic}
.err{max-width:210mm;margin:16px auto;background:#fff3f3;border:1px solid #e0a0a0;color:#8a1f1f;padding:14px;border-radius:8px}
@media print{
  body{background:#fff}
  .toolbar,.err{display:none!important}
  .sheet{box-shadow:none;margin:0;width:auto;min-height:auto;page-break-after:always}
  .sheet:last-child{page-break-after:auto}
  @page{size:A4;margin:0}
}
</style>
</head><body>
<div class="toolbar">
  <button class="btn" onclick="window.print()">🖨️ พิมพ์ / Save PDF</button>
  <button class="btn ghost" onclick="window.close()">ปิด</button>
  <span class="info" id="info">กำลังโหลด...</span>
</div>
<div id="docs"></div>

<script src="/js/app.js?v=20261002"></script>
<script>
if(!requireLogin()) throw '';
const u = getUser();
// HQ only — same gate as approvals.html.
if (!['super_admin','admin_scm','finance'].includes(u.role)) { location.href = '/index.html'; throw ''; }

const COMPANY_NAME = 'Jian Cha Co.,Ltd. (บริษัท เจียนฉา จำกัด)';
const esc = v => String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const money = n => (Math.round((Number(n) || 0) * 100) / 100).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const qty = n => { const v = Number(n) || 0; return Number.isInteger(v) ? v.toLocaleString() : v.toLocaleString('th-TH', { maximumFractionDigits: 3 }); };

function renderPO(o) {
  const b = o.buyer || {};
  const branchName = b.branch_display_name || b.branch_name || '-';
  const lines = o.lines || [];
  // Line amounts use the vendor purchase cost (items_cache.unit_cost) — the
  // same value stamped on the BC PO line — not the branch sales price.
  let subtotal = 0;
  const rows = lines.map((l, i) => {
    const cost = Number(l.unit_cost) || 0;
    const amt = cost * (Number(l.quantity) || 0);
    subtotal += amt;
    return `<tr>
      <td class="ctr">${i + 1}</td>
      <td class="mono">${esc(l.item_no)}</td>
      <td>${esc(l.item_name)}${l.item_name_en && l.item_name_en !== l.item_name ? `<div style="font-size:10px;color:#666">${esc(l.item_name_en)}</div>` : ''}</td>
      <td class="num">${qty(l.quantity)}</td>
      <td class="ctr">${esc(l.uom || '')}</td>
      <td class="num">${cost ? money(cost) : '—'}</td>
      <td class="num">${cost ? money(amt) : '—'}</td>
    </tr>`;
  }).join('');
  const vat = Math.round(subtotal * 7) / 100;
  const grand = subtotal + vat;
  const docDate = o.verified_at || (o.payment && o.payment.verified_at) || o.paid_at || o.created_at;
  return `<div class="sheet">
    <div class="hdr">
      <div class="co">${esc(COMPANY_NAME)}<small>JC-Market · B2B stock ordering</small></div>
      <div class="title"><h1>ใบสั่งซื้อ</h1><div class="en">PURCHASE ORDER</div></div>
    </div>
    <div class="meta">
      <div class="box">
        <div class="lbl">Vendor / ผู้ขาย</div>
        <div class="val">${esc(o.po_vendor_no || '-')}</div>
        <div class="sub">BC Vendor No.</div>
      </div>
      <div class="box">
        <div class="kv">
          <b>PO No.</b><span class="mono" style="font-size:13px;font-weight:700">${esc(o.bc_po_no || '-')}</span>
          <b>วันที่ PO</b><span>${fmtDMY(docDate) || '-'}</span>
          <b>เลขคำสั่งซื้อ</b><span class="mono">${esc(o.order_number)}</span>
          ${o.bc_so_no ? `<b>BC SO</b><span class="mono">${esc(o.bc_so_no)}</span>` : ''}
        </div>
      </div>
      <div class="box">
        <div class="lbl">Ship to / สถานที่ส่ง</div>
        <div class="val">${esc(branchName)} <span class="mono">(${esc(b.branch_code || o.branch_code || '-')})</span></div>
        ${b.branch_address ? `<div class="sub">${esc(b.branch_address)}</div>` : ''}
        ${b.branch_phone || b.user_phone ? `<div class="sub">โทร ${esc(b.branch_phone || b.user_phone)}</div>` : ''}
      </div>
      <div class="box">
        <div class="kv">
          <b>วันสั่งซื้อ</b><span>${fmtDMY(o.created_at)} ${fmtHM(o.created_at)}</span>
          <b>วันจัดส่ง</b><span>${fmtDMY(o.delivery_date) || '-'}</span>
          <b>ผู้สั่งซื้อ</b><span>${esc(b.full_name || '-')}</span>
          <b>ชำระเงิน</b><span>${esc(o.payment_method === 'credit_7d' ? 'เครดิต 7 วัน' : (String(o.order_type||'').startsWith('jc_') ? 'ภายใน (JC)' : 'โอนทันที'))}</span>
        </div>
      </div>
    </div>
    <table>
      <thead><tr>
        <th class="ctr" style="width:28px">#</th>
        <th style="width:80px">รหัสสินค้า</th>
        <th>รายการ</th>
        <th class="num" style="width:60px">จำนวน</th>
        <th class="ctr" style="width:48px">หน่วย</th>
        <th class="num" style="width:78px">ราคา/หน่วย</th>
        <th class="num" style="width:90px">จำนวนเงิน</th>
      </tr></thead>
      <tbody>${rows || '<tr><td colspan="7" class="ctr">ไม่มีรายการ</td></tr>'}</tbody>
    </table>
    <table class="totals">
      <tr><td>รวมเป็นเงิน</td><td class="num">${money(subtotal)}</td></tr>
      <tr><td>ภาษีมูลค่าเพิ่ม 7%</td><td class="num">${money(vat)}</td></tr>
      <tr class="grand"><td>รวมทั้งสิ้น</td><td class="num">฿${money(grand)}</td></tr>
    </table>
    <div class="note">ราคาต่อหน่วยอ้างอิงจาก Purchase Order ใน Business Central${o.note ? ` · หมายเหตุ: ${esc(o.note)}` : ''}</div>
    <div class="sign">
      <div><div class="line"></div>ผู้สั่งซื้อ / Purchaser</div>
      <div><div class="line"></div>ผู้อนุมัติ / Approved by</div>
      <div><div class="line"></div>ผู้ขาย / Vendor</div>
    </div>
    <div class="foot">เอกสารนี้สร้างจาก JC-Market · PO ${esc(o.bc_po_no || '-')} · พิมพ์เมื่อ ${new Date().toLocaleDateString('en-GB')} โดย ${esc(u.full_name)}</div>
  </div>`;
}

async function main() {
  const ids = (new URLSearchParams(location.search).get('ids') || '').split(',').map(s => s.trim()).filter(Boolean);
  const docs = document.getElementById('docs');
  const info = document.getElementById('info');
  if (!ids.length) { docs.innerHTML = '<div class="err">ไม่ได้ระบุรายการที่จะพิมพ์ — เปิดหน้านี้จากปุ่มเครื่องพิมพ์ในแท็บ "อนุมัติแล้ว"</div>'; info.textContent = ''; return; }
  const results = await Promise.all(ids.map(id => api('/api/orders/' + id).catch(e => ({ _error: e.message, id }))));
  const ok = results.filter(o => !o._error && o.bc_po_no);
  const noPo = results.filter(o => !o._error && !o.bc_po_no);
  const failed = results.filter(o => o._error);
  let html = ok.map(renderPO).join('');
  if (noPo.length) html = `<div class="err">ข้าม ${noPo.length} รายการที่ยังไม่มีเลข PO: ${noPo.map(o => esc(o.order_number)).join(', ')}</div>` + html;
  if (failed.length) html = `<div class="err">โหลดไม่สำเร็จ ${failed.length} รายการ: ${failed.map(o => esc(o._error)).join(' · ')}</div>` + html;
  docs.innerHTML = html || '<div class="err">ไม่มีใบ PO ที่พิมพ์ได้</div>';
  info.textContent = ok.length ? `ใบ PO ${ok.length} ฉบับ — ${ok.map(o => o.bc_po_no).join(', ')}` : '';
  document.title = ok.length === 1 ? `PO ${ok[0].bc_po_no} — JC-Market` : `พิมพ์ใบ PO (${ok.length}) — JC-Market`;
}
main().catch(e => { document.getElementById('docs').innerHTML = `<div class="err">${esc(e.message)}</div>`; });
</script>
</body></html>
