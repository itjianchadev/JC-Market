<!doctype html>
<html lang="th"><head>
<meta charset="utf-8"><title>เข้าสู่ระบบ — JC-Stock Market</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head><body>
<div class="login-wrap"><div class="login-box">
  <h1>🛍️ JC-Stock Market</h1>
  <p class="sub">ระบบสั่งซื้อวัตถุดิบสำหรับสาขา FC</p>
  <form id="f">
    <label>Username</label>
    <input name="username" required autofocus>
    <label>Password</label>
    <input name="password" type="password" required>
    <button class="btn" type="submit">เข้าสู่ระบบ</button>
    <div class="err" id="err"></div>
  </form>
  <p class="sub" style="margin-top:20px;font-size:12px">Demo: admin/admin1234 · jf039/fc1234</p>
</div></div>
<script src="/js/app.js"></script>
<script>
document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  try {
    const r = await api('/api/login', { method:'POST', body: JSON.stringify({ username: fd.get('username'), password: fd.get('password') }) });
    setAuth(r.token, r.user);
    location.href = '/index.html';
  } catch (err) { document.getElementById('err').textContent = err.message; }
};
</script>
</body></html>
