<!doctype html>
<html lang="th"><head>
<meta charset="utf-8"><title>ตะกร้า — JC-Market</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
.cart-table{width:100%;border-collapse:collapse}
.cart-table th{text-align:left;color:var(--muted);font-size:13px;padding:10px 8px;border-bottom:1px solid var(--border)}
.cart-table td{padding:12px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
.qty-wrap{display:flex;align-items:center;gap:6px}
.qty-wrap input{min-width:40px;max-width:80px;width:auto;text-align:center;padding:6px 4px}
.qty-wrap button{width:30px;height:30px;display:flex;align-items:center;justify-content:center}
.summary{display:flex;justify-content:space-between;align-items:center;padding:20px 0;flex-wrap:wrap;gap:12px}
.summary .total{font-size:28px;font-weight:700;color:var(--gold)}
</style>
</head><body data-i18n-title="cart.page_title">
<div id="nav"></div>
<div class="container">
  <h2 style="margin-bottom:16px" data-i18n="cart.title">ตะกร้าสินค้า</h2>
  <div class="card">
    <div id="cartContent" data-i18n="common.loading">กำลังโหลด...</div>
  </div>
</div>
<script src="/js/app.js?v=20260604i"></script>
<script>
if(!requireLogin()) throw '';
if(!denyFinance()) throw '';
document.getElementById('nav').innerHTML = renderNav('cart.html');

let cartData = null;

async function load() {
  try {
    cartData = await api('/api/cart');
    render();
    updateCartBadge();
  } catch (e) { document.getElementById('cartContent').textContent = e.message; }
}

function render() {
  const el = document.getElementById('cartContent');
  if (!cartData || !cartData.items.length) {
    el.innerHTML = `<div style="text-align:center;padding:40px;color:var(--muted)">
      <p style="font-size:48px;margin-bottom:12px">🧺</p>
      <p>${t('cart.empty')}</p>
      <a href="index.html" class="btn" style="margin-top:16px;display:inline-block">${t('cart.choose')}</a>
    </div>`;
    return;
  }
  // Cart is uniform by the no-mixed-categories rule, so the first item's
  // group represents the whole cart.
  const firstCat = cartData.items[0] && cartData.items[0].category;
  const grp = firstCat ? categoryGroup(firstCat) : '';
  const grpLabel = grp ? t('shop.group_' + grp) : '';
  const banner = grp
    ? `<div style="margin-bottom:16px;padding:10px 14px;background:rgba(173,156,130,.12);border-left:3px solid var(--gold);border-radius:6px;font-size:13px;color:var(--text)">${t('cart.group_locked', { grp: grpLabel })}</div>`
    : '';
  el.innerHTML = `
    ${banner}
    <table class="cart-table">
      <thead><tr>
        <th>${t('cart.col.item')}</th><th>${t('cart.col.price_unit')}</th><th>${t('cart.col.qty')}</th><th>${t('cart.col.uom')}</th><th>${t('cart.col.total')}</th><th></th>
      </tr></thead>
      <tbody>
        ${cartData.items.map(it => `<tr>
          <td>
            <strong>${itemName(it)||it.item_no}</strong>
            <div style="font-size:12px;color:var(--muted)">${it.item_no} | ${catName(it.category)||'-'} | ${t('cart.remaining')} ${it.inventory} ${it.uom||''}</div>
          </td>
          <td>฿${it.unit_price.toLocaleString()}</td>
          <td>
            <div class="qty-wrap">
              <button class="btn sm ghost" onclick="updateQty(${it.id},${it.quantity-1})">-</button>
              <input type="number" value="${it.quantity}" min="1" max="${it.inventory}" onchange="updateQty(${it.id},this.value)" style="width:${Math.max(40, String(it.quantity).length * 16 + 24)}px">
              <button class="btn sm ghost" onclick="updateQty(${it.id},${it.quantity+1})">+</button>
            </div>
          </td>
          <td style="color:var(--muted)">${it.uom||'-'}</td>
          <td style="font-weight:600;color:var(--gold)">฿${(it.quantity*it.unit_price).toLocaleString()}</td>
          <td><button class="btn sm ghost" style="color:var(--err);border-color:var(--err)" onclick="removeItem(${it.id})">${t('common.delete')}</button></td>
        </tr>`).join('')}
      </tbody>
    </table>
    <div class="summary">
      <div>
        <button class="btn ghost" onclick="clearCart()">${t('cart.clear')}</button>
        <a href="index.html" class="btn ghost" style="margin-left:8px">${t('cart.choose_more')}</a>
      </div>
      <div style="text-align:right">
        <div style="color:var(--muted);font-size:14px">${t('cart.items_count', { n: cartData.count })}</div>
        <div class="total">฿${cartData.subtotal.toLocaleString()}</div>
        <div style="color:var(--muted);font-size:12px">${t('cart.vat_note')}</div>
        <button class="btn" style="margin-top:12px;font-size:16px;padding:12px 32px" onclick="goCheckout()">${t('cart.checkout')}</button>
      </div>
    </div>`;
}

async function updateQty(id, qty) {
  qty = parseInt(qty);
  if (isNaN(qty) || qty < 0) return;
  try {
    await api('/api/cart/' + id, { method: 'PUT', body: JSON.stringify({ quantity: qty }) });
    load();
  } catch (e) { toast(e.message); }
}

async function removeItem(id) {
  try {
    await api('/api/cart/' + id, { method: 'DELETE' });
    toast(t('cart.removed'));
    load();
  } catch (e) { toast(e.message); }
}

async function clearCart() {
  if (!confirm(t('cart.confirm_clear'))) return;
  try {
    await api('/api/cart', { method: 'DELETE' });
    load();
  } catch (e) { toast(e.message); }
}

function goCheckout() {
  location.href = '/checkout.html';
}

window.onLangChange = () => {
  document.getElementById('nav').innerHTML = renderNav('cart.html');
  render();
};

load();
</script>
</body></html>
